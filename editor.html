<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Word Drills — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --surface:#232E3D;
    --surface-2:#2C3849;
    --paper:#EDE6D6;
    --paper-dim:#B9B2A2;
    --amber:#E8A33D;
    --sage:#6FA97A;
    --rust:#C8563D;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    min-height:100dvh;
  }
  .app{ width:100%; max-width:600px; padding:20px 18px 60px; }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 4px;
  }
  h1 span{color:var(--amber);}
  .sub{ color:var(--paper-dim); font-size:13px; margin-bottom:20px; }
  .card{ background:var(--surface); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  label.field-label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--amber);
    margin-bottom:6px;
    margin-top:12px;
  }
  label.field-label:first-child{margin-top:0;}
  input, textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid var(--surface-2);
    background:var(--surface-2);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:15px;
  }
  textarea{ font-family:'IBM Plex Mono',monospace; font-size:13px; min-height:90px; resize:vertical; }
  .row{ display:flex; gap:8px; }
  .row > div{ flex:1; }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border-radius:8px;
    border:none;
    padding:12px 16px;
    cursor:pointer;
  }
  .btn-primary{ background:var(--amber); color:var(--ink); }
  .btn-secondary{ background:var(--surface-2); color:var(--paper); border:1px solid #3a4759; }
  .btn-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  table{ width:100%; border-collapse:collapse; margin-top:6px; font-size:14px; }
  th{
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    color:var(--paper-dim);
    padding:8px 6px;
    border-bottom:1px solid var(--surface-2);
  }
  td{ padding:8px 6px; border-bottom:1px solid var(--surface-2); vertical-align:middle; }
  td input{ padding:8px; font-size:13px; }
  .del-btn{
    background:transparent;
    color:var(--rust);
    border:1px solid var(--rust);
    padding:6px 10px;
    font-size:12px;
  }
  .count-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-dim);
    margin-bottom:8px;
  }
  .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--sage);
    margin-top:10px;
    min-height:16px;
  }
  a.back-link{
    color:var(--paper-dim);
    font-size:12px;
    text-decoration:none;
    font-family:'IBM Plex Mono',monospace;
  }
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="index.html">&larr; back to app</a>
  <h1>Word<span>Drills</span> Editor</h1>
  <div class="sub">Add, edit, or remove words, then download words.json and replace the file in your GitHub repo.</div>

  <div class="card">
    <label class="field-label">Load existing words.json</label>
    <div class="btn-row">
      <button class="btn-secondary" id="load-btn">Load from words.json</button>
      <button class="btn-secondary" id="paste-toggle-btn">Paste JSON instead</button>
    </div>
    <div class="hidden-paste" id="paste-area" style="display:none; margin-top:12px;">
      <textarea id="paste-input" placeholder='[{"word":"hello","translation":"cześć","category":"greetings"}]'></textarea>
      <div class="btn-row"><button class="btn-primary" id="paste-import-btn">Import pasted JSON</button></div>
    </div>
    <div class="status" id="load-status"></div>
  </div>

  <div class="card">
    <label class="field-label">Add a word</label>
    <div class="row">
      <div><input id="new-word" placeholder="Word (e.g. hello)"></div>
      <div><input id="new-translation" placeholder="Translation (e.g. cześć)"></div>
    </div>
    <label class="field-label">Category</label>
    <input id="new-category" list="category-list" placeholder="e.g. greetings">
    <datalist id="category-list"></datalist>
    <div class="btn-row">
      <button class="btn-primary" id="add-btn">Add word</button>
    </div>

    <label class="field-label">Or bulk add (one per line: word - translation - category)</label>
    <textarea id="bulk-input" placeholder="hello - cześć - greetings&#10;goodbye - do widzenia - greetings"></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="bulk-add-btn">Add lines</button>
    </div>
  </div>

  <div class="card">
    <div class="count-tag" id="word-count">0 words</div>
    <table>
      <thead><tr><th>Word</th><th>Translation</th><th>Category</th><th></th></tr></thead>
      <tbody id="word-table-body"></tbody>
    </table>
  </div>

  <div class="card">
    <label class="field-label">Export</label>
    <div class="btn-row">
      <button class="btn-primary" id="download-btn">Download words.json</button>
      <button class="btn-secondary" id="copy-btn">Copy JSON to clipboard</button>
    </div>
    <div class="status" id="export-status"></div>
  </div>
</div>

<script>
let words = [];
const el = id => document.getElementById(id);

function refreshTable(){
  const body = el('word-table-body');
  body.innerHTML = '';
  words.forEach((w, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input data-i="${i}" data-field="word" value="${escapeAttr(w.word)}"></td>
      <td><input data-i="${i}" data-field="translation" value="${escapeAttr(w.translation)}"></td>
      <td><input data-i="${i}" data-field="category" value="${escapeAttr(w.category)}"></td>
      <td><button class="del-btn" data-i="${i}">Delete</button></td>
    `;
    body.appendChild(tr);
  });
  body.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = e.target.dataset.i, field = e.target.dataset.field;
      words[i][field] = e.target.value;
      refreshCategoryList();
    });
  });
  body.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      words.splice(e.target.dataset.i, 1);
      refreshTable();
    });
  });
  el('word-count').textContent = words.length + ' word' + (words.length === 1 ? '' : 's');
  refreshCategoryList();
}

function refreshCategoryList(){
  const cats = [...new Set(words.map(w => w.category).filter(Boolean))];
  el('category-list').innerHTML = cats.map(c => `<option value="${escapeAttr(c)}">`).join('');
}

function escapeAttr(s){
  return String(s || '').replace(/"/g, '&quot;');
}

el('load-btn').addEventListener('click', () => {
  fetch('words.json')
    .then(r => r.json())
    .then(data => {
      words = data;
      refreshTable();
      el('load-status').textContent = 'Loaded ' + data.length + ' words.';
    })
    .catch(() => {
      el('load-status').textContent = 'Could not load words.json from this folder.';
    });
});

el('paste-toggle-btn').addEventListener('click', () => {
  const area = el('paste-area');
  area.style.display = area.style.display === 'none' ? 'block' : 'none';
});

el('paste-import-btn').addEventListener('click', () => {
  try {
    const data = JSON.parse(el('paste-input').value);
    words = data;
    refreshTable();
    el('load-status').textContent = 'Imported ' + data.length + ' words.';
  } catch (err) {
    el('load-status').textContent = 'Invalid JSON — check formatting.';
  }
});

el('add-btn').addEventListener('click', () => {
  const word = el('new-word').value.trim();
  const translation = el('new-translation').value.trim();
  const category = el('new-category').value.trim() || 'uncategorized';
  if (!word || !translation) return;
  words.push({ word, translation, category });
  el('new-word').value = '';
  el('new-translation').value = '';
  el('new-category').value = '';
  refreshTable();
});

el('bulk-add-btn').addEventListener('click', () => {
  const lines = el('bulk-input').value.split('\n').map(l => l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line => {
    const parts = line.split('-').map(p => p.trim());
    if (parts.length >= 2){
      words.push({
        word: parts[0],
        translation: parts[1],
        category: parts[2] || 'uncategorized'
      });
      added++;
    }
  });
  el('bulk-input').value = '';
  refreshTable();
  el('load-status').textContent = 'Added ' + added + ' words from bulk input.';
});

el('download-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(words, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'words.json';
  a.click();
  URL.revokeObjectURL(url);
  el('export-status').textContent = 'Downloaded — now replace words.json in your GitHub repo with this file.';
});

el('copy-btn').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify(words, null, 2))
    .then(() => { el('export-status').textContent = 'Copied to clipboard.'; })
    .catch(() => { el('export-status').textContent = 'Could not copy — try Download instead.'; });
});

refreshTable();
</script>
</body>
</html>
