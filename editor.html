<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Word Drills — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --surface:#232E3D;
    --surface-2:#2C3849;
    --paper:#EDE6D6;
    --paper-dim:#B9B2A2;
    --amber:#E8A33D;
    --sage:#6FA97A;
    --rust:#C8563D;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    min-height:100dvh;
  }
  .app{ width:100%; max-width:600px; padding:20px 18px 60px; }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 4px;
  }
  h1 span{color:var(--amber);}
  .sub{ color:var(--paper-dim); font-size:13px; margin-bottom:20px; }
  .card{ background:var(--surface); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  label.field-label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--amber);
    margin-bottom:6px;
    margin-top:12px;
  }
  label.field-label:first-child{margin-top:0;}
  input, textarea, select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid var(--surface-2);
    background:var(--surface-2);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:15px;
  }
  select{ appearance:none; -webkit-appearance:none; cursor:pointer; }
  textarea{ font-family:'IBM Plex Mono',monospace; font-size:13px; min-height:90px; resize:vertical; }
  .row{ display:flex; gap:8px; }
  .row > div{ flex:1; }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border-radius:8px;
    border:none;
    padding:12px 16px;
    cursor:pointer;
    transition:all 0.2s;
  }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-primary{ background:var(--amber); color:var(--ink); }
  .btn-secondary{ background:var(--surface-2); color:var(--paper); border:1px solid #3a4759; }
  .btn-secondary.active{ border-color:var(--amber); color:var(--amber); background:rgba(232,163,61,0.08); }
  .btn-github{ background:var(--sage); color:var(--ink); }
  .btn-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  table{ width:100%; border-collapse:collapse; margin-top:6px; font-size:14px; }
  th{
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    color:var(--paper-dim);
    padding:8px 6px;
    border-bottom:1px solid var(--surface-2);
  }
  td{ padding:8px 6px; border-bottom:1px solid var(--surface-2); vertical-align:middle; }
  td input{ padding:8px; font-size:13px; }
  .del-btn{
    background:transparent;
    color:var(--rust);
    border:1px solid var(--rust);
    padding:6px 10px;
    font-size:12px;
  }
  .count-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-dim);
    margin-bottom:8px;
  }
  .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--paper-dim);
    margin-top:10px;
    min-height:20px;
  }
  .status.error{ color:var(--rust); }
  .status.success{ color:var(--sage); }
  a.back-link{
    color:var(--paper-dim);
    font-size:12px;
    text-decoration:none;
    font-family:'IBM Plex Mono',monospace;
  }
  .token-note{
    font-size:12px;
    color:var(--paper-dim);
    margin-top:8px;
    line-height:1.5;
  }
  .token-row{ display:flex; gap:8px; align-items:center; margin-top:6px; }
  .token-row input{ flex:1; }
  .token-saved-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--sage);
    margin-top:6px;
  }

  /* Voice Manager */
  .voice-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-top:1px solid var(--surface-2);
  }
  .voice-item:first-child{border-top:none;}
  .voice-word{font-weight:600; font-size:15px;}
  .voice-meta{font-size:12px; color:var(--paper-dim); margin-left:8px;}
  .voice-actions{display:flex; gap:6px;}
  .voice-actions button{
    padding:4px 10px;
    border-radius:6px;
    border:1px solid var(--surface-2);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
    font-size:12px;
    transition:all 0.2s;
  }
  .voice-actions button:hover{ border-color:var(--paper-dim); }
  .voice-actions .play-btn{color:var(--sage);}
  .voice-actions .play-btn:hover{border-color:var(--sage);}
  .voice-actions .delete-btn{color:var(--rust);}
  .voice-actions .delete-btn:hover{border-color:var(--rust);}
  .recording-indicator{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--rust);
    animation:pulse 1s infinite;
    margin-right:8px;
    vertical-align:middle;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.3;}
  }
  .voice-count{ font-size:13px; color:var(--paper-dim); margin-bottom:6px; }
  .voice-count strong{color:var(--paper);}
  .empty-state{
    text-align:center;
    color:var(--paper-dim);
    font-size:13px;
    padding:20px 0;
  }
  .voice-progress-bar{
    height:4px;
    background:var(--surface-2);
    border-radius:2px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .voice-progress-fill{
    height:100%;
    background:var(--sage);
    width:0%;
    transition:width 0.3s;
  }
  .filter-row{ display:flex; gap:8px; margin-bottom:10px; }
  .filter-row button{ flex:1; padding:8px; font-size:13px; }
  .voice-select-row{ display:flex; gap:8px; margin-bottom:10px; }
  .voice-select-row select{ flex:3; }
  .voice-select-row button{ flex:1; min-width:80px; }
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="index.html">&larr; back to app</a>
  <h1>Word<span>Drills</span> Editor</h1>
  <div class="sub">Paste from Google Docs, edit words, record your voice, then save to GitHub.</div>

  <!-- ===== GITHUB ===== -->
  <div class="card">
    <label class="field-label">GitHub</label>
    <div class="sub" style="margin-bottom:6px;">hubitml/Audrey — words.json on main</div>
    <div class="token-row">
      <input id="github-token" type="password" placeholder="GitHub token">
      <button class="btn-secondary" id="token-save-btn">Save</button>
    </div>
    <div class="token-row">
      <button class="btn-secondary" id="token-clear-btn">Clear token</button>
    </div>
    <div class="token-saved-tag" id="token-saved-tag"></div>
    <div class="token-note">Token stored only in this browser. Revoke at github.com/settings/tokens if compromised.</div>
    <div class="btn-row">
      <button class="btn-github" id="github-load-btn">↻ Load</button>
      <button class="btn-github" id="github-save-btn">💾 Save</button>
    </div>
    <div class="status" id="github-status"></div>
  </div>

  <!-- ===== PASTE ===== -->
  <div class="card">
    <label class="field-label">Paste from Google Docs / Sheets</label>
    <textarea id="table-input" style="min-height:160px;" placeholder="Topic: Hospitality

Sól
Salt
Pieprz
Pepper
Kurczak
Chicken">Topic: </textarea>
    <div class="btn-row">
      <button class="btn-primary" id="table-import-btn">Add from paste</button>
      <button class="btn-secondary" id="table-replace-btn">Replace all</button>
    </div>
    <div class="status" id="table-status"></div>
  </div>

  <!-- ===== SINGLE WORD ===== -->
  <div class="card">
    <label class="field-label">Add single word</label>
    <div class="row">
      <div><input id="new-word" placeholder="Word (e.g. hello)"></div>
      <div><input id="new-translation" placeholder="Translation (e.g. cześć)"></div>
    </div>
    <input id="new-category" list="category-list" placeholder="Category" style="margin-top:8px;">
    <datalist id="category-list"></datalist>
    <div class="btn-row">
      <button class="btn-primary" id="add-btn">Add</button>
    </div>
  </div>

  <!-- ===== VOICE MANAGER ===== -->
  <div class="card">
    <label class="field-label">Voice recordings</label>
    <div class="voice-count"><strong id="voice-total">0</strong> / <strong id="voice-total-words">0</strong> words recorded</div>
    
    <div class="voice-progress-bar">
      <div class="voice-progress-fill" id="voice-progress-bar"></div>
    </div>

    <div class="voice-select-row">
      <select id="voice-word-select">
        <option value="">Select a word to record...</option>
      </select>
      <button class="btn-primary" id="voice-record-btn">🔴 Record</button>
    </div>

    <div class="filter-row">
      <button class="btn-secondary active" id="voice-filter-unrecorded">🎯 Unrecorded only</button>
      <button class="btn-secondary" id="voice-filter-all">📋 All words</button>
    </div>

    <div id="voice-status" class="status"></div>
    <div id="voice-list"></div>

    <div class="btn-row">
      <button class="btn-secondary" id="voice-export-btn">📤 Export</button>
      <button class="btn-secondary" id="voice-import-btn">📥 Import</button>
      <button class="btn-secondary" id="voice-delete-all-btn" style="border-color:var(--rust); color:var(--rust);">🗑️ Clear all</button>
    </div>
    <input type="file" id="voice-import-file" accept=".json" style="display:none;">
    <div id="voice-import-status" class="status"></div>
  </div>

  <!-- ===== WORD TABLE ===== -->
  <div class="card">
    <div class="count-tag" id="word-count">0 words</div>
    <table>
      <thead><tr><th>Word</th><th>Translation</th><th>Category</th><th></th></tr></thead>
      <tbody id="word-table-body"></tbody>
    </table>
  </div>
</div>

<script>
// ================================================================
//  UTILITY
// ================================================================
const Utils = {
  wordKey: (item) => item.word + '|' + item.translation,
  escapeAttr: (s) => String(s || '').replace(/"/g, '&quot;'),
  capitalize: (s) => s.charAt(0).toUpperCase() + s.slice(1)
};

const el = id => document.getElementById(id);

// ================================================================
//  WORD MANAGER
// ================================================================
let words = [];

function refreshTable(){
  const body = el('word-table-body');
  body.innerHTML = '';
  words.forEach((w, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input data-i="${i}" data-field="word" value="${Utils.escapeAttr(w.word)}"></td>
      <td><input data-i="${i}" data-field="translation" value="${Utils.escapeAttr(w.translation)}"></td>
      <td><input data-i="${i}" data-field="category" value="${Utils.escapeAttr(w.category)}"></td>
      <td><button class="del-btn" data-i="${i}">Delete</button></td>
    `;
    body.appendChild(tr);
  });
  body.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = e.target.dataset.i, field = e.target.dataset.field;
      words[i][field] = e.target.value;
      refreshCategoryList();
      populateWordSelect();
      updateVoiceCount();
    });
  });
  body.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      words.splice(e.target.dataset.i, 1);
      refreshTable();
      populateWordSelect();
      updateVoiceCount();
    });
  });
  el('word-count').textContent = words.length + ' word' + (words.length === 1 ? '' : 's');
  refreshCategoryList();
}

function refreshCategoryList(){
  const cats = [...new Set(words.map(w => w.category).filter(Boolean))];
  el('category-list').innerHTML = cats.map(c => `<option value="${Utils.escapeAttr(c)}">`).join('');
}

// ================================================================
//  GITHUB
// ================================================================
const GH_OWNER = 'hubitml';
const GH_REPO = 'Audrey';
const GH_BRANCH = 'main';
const GH_PATH = 'words.json';
const GH_TOKEN_KEY = 'wordDrillsGithubToken';
let currentFileSha = null;

function getToken(){ return localStorage.getItem(GH_TOKEN_KEY) || ''; }
function setToken(token){ localStorage.setItem(GH_TOKEN_KEY, token); updateTokenSavedTag(); }
function clearToken(){ localStorage.removeItem(GH_TOKEN_KEY); el('github-token').value = ''; updateTokenSavedTag(); }
function updateTokenSavedTag(){
  el('token-saved-tag').textContent = getToken() ? '✓ Token saved' : 'No token saved';
}

el('token-save-btn').addEventListener('click', () => {
  const val = el('github-token').value.trim();
  if (!val){ el('github-status').textContent = 'Enter a token.'; el('github-status').className = 'status error'; return; }
  setToken(val);
  el('github-token').value = '';
  el('github-status').textContent = 'Token saved.';
  el('github-status').className = 'status';
});

el('token-clear-btn').addEventListener('click', () => {
  clearToken();
  el('github-status').textContent = 'Token cleared.';
  el('github-status').className = 'status';
});

el('github-load-btn').addEventListener('click', async () => {
  const status = el('github-status');
  const token = getToken();
  if (!token){ status.textContent = 'Save a GitHub token first.'; status.className = 'status error'; return; }
  status.textContent = 'Loading…';
  status.className = 'status';
  try {
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`GitHub ${res.status}: ${res.statusText}`);
    const data = await res.json();
    currentFileSha = data.sha;
    const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    words = JSON.parse(decoded);
    refreshTable();
    populateWordSelect();
    updateVoiceCount();
    status.textContent = `Loaded ${words.length} words.`;
    status.className = 'status';
  } catch (err) {
    status.textContent = 'Load failed: ' + err.message;
    status.className = 'status error';
  }
});

el('github-save-btn').addEventListener('click', async () => {
  const status = el('github-status');
  const token = getToken();
  if (!token){ status.textContent = 'Save a GitHub token first.'; status.className = 'status error'; return; }
  status.textContent = 'Saving…';
  status.className = 'status';
  try {
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
    const shaRes = await fetch(`${url}?ref=${GH_BRANCH}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (shaRes.ok){ const shaData = await shaRes.json(); currentFileSha = shaData.sha; }

    const jsonStr = JSON.stringify(words, null, 2);
    const contentB64 = btoa(unescape(encodeURIComponent(jsonStr)));
    const body = { message: `Update words.json (${words.length} words)`, content: contentB64, branch: GH_BRANCH };
    if (currentFileSha) body.sha = currentFileSha;

    const putRes = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!putRes.ok){ const errData = await putRes.json().catch(() => ({})); throw new Error(`GitHub ${putRes.status}: ${errData.message || putRes.statusText}`); }
    const putData = await putRes.json();
    currentFileSha = putData.content.sha;
    status.textContent = `Saved ${words.length} words.`;
    status.className = 'status';
  } catch (err) {
    status.textContent = 'Save failed: ' + err.message;
    status.className = 'status error';
  }
});

// ================================================================
//  PASTE
// ================================================================
function splitCells(line){
  if (line.includes('\t')) return line.split('\t').map(c => c.trim());
  if (line.includes(',')) return line.split(',').map(c => c.trim());
  if (line.includes(' - ') || /^\S+\s*-\s*\S/.test(line)) return line.split('-').map(c => c.trim());
  return [line.trim()];
}

function looksLikeHeader(cells){
  const joined = cells.join(' ').toLowerCase();
  return /\b(word|translation|category|term|meaning)\b/.test(joined) && cells.length <= 4;
}

function parseTable(text){
  const rawLines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const parsed = [];
  let currentCategory = 'uncategorized';
  let pendingWord = null;

  rawLines.forEach((line, idx) => {
    const topicMatch = line.match(/^(topic|category)\s*:\s*(.+)$/i);
    if (topicMatch){ currentCategory = topicMatch[2].trim(); pendingWord = null; return; }
    const cells = splitCells(line).map(c => c.replace(/^"|"$/g, ''));
    if (idx === 0 && looksLikeHeader(cells)) return;
    if (cells.length >= 2 && cells[0] && cells[1]){
      parsed.push({ word: cells[0], translation: cells[1], category: cells[2] || currentCategory });
      pendingWord = null;
    } else if (cells[0]){
      if (pendingWord === null){ pendingWord = cells[0]; }
      else { parsed.push({ word: pendingWord, translation: cells[0], category: currentCategory }); pendingWord = null; }
    }
  });
  return parsed;
}

el('table-import-btn').addEventListener('click', () => {
  const parsed = parseTable(el('table-input').value);
  if (parsed.length === 0){ el('table-status').textContent = 'No words found.'; return; }
  words = words.concat(parsed);
  refreshTable();
  populateWordSelect();
  updateVoiceCount();
  el('table-status').textContent = 'Added ' + parsed.length + ' words.';
  el('table-input').value = 'Topic: ';
});

el('table-replace-btn').addEventListener('click', () => {
  const parsed = parseTable(el('table-input').value);
  if (parsed.length === 0){ el('table-status').textContent = 'No words found.'; return; }
  words = parsed;
  refreshTable();
  populateWordSelect();
  updateVoiceCount();
  el('table-status').textContent = 'Replaced with ' + parsed.length + ' words.';
  el('table-input').value = 'Topic: ';
});

// ================================================================
//  SINGLE WORD
// ================================================================
el('add-btn').addEventListener('click', () => {
  const word = el('new-word').value.trim();
  const translation = el('new-translation').value.trim();
  const category = el('new-category').value.trim() || 'uncategorized';
  if (!word || !translation) return;
  words.push({ word, translation, category });
  el('new-word').value = '';
  el('new-translation').value = '';
  el('new-category').value = '';
  refreshTable();
  populateWordSelect();
  updateVoiceCount();
});

// ================================================================
//  VOICE MANAGER - IndexedDB
// ================================================================
const VoiceManager = {
  dbName: 'WordDrillsVoices',
  dbVersion: 1,
  storeName: 'recordings',
  db: null,
  mediaRecorder: null,
  audioChunks: [],
  isRecording: false,

  async init() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, this.dbVersion);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(this.storeName)) {
          const store = db.createObjectStore(this.storeName, { keyPath: 'wordKey' });
          store.createIndex('word', 'word', { unique: false });
          store.createIndex('translation', 'translation', { unique: false });
        }
      };
      request.onsuccess = (event) => { this.db = event.target.result; resolve(); };
      request.onerror = (event) => { reject(event.target.error); };
    });
  },

  async saveRecording(wordKey, word, translation, category, audioBlob) {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const record = { wordKey, word, translation, category: category || 'unknown', audioBlob, timestamp: Date.now() };
      const request = store.put(record);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  },

  async getRecording(wordKey) {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(wordKey);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  },

  async getAllRecordings() {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  },

  async deleteRecording(wordKey) {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.delete(wordKey);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  },

  async deleteAll() {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  },

  async startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.mediaRecorder = new MediaRecorder(stream);
      this.audioChunks = [];
      this.mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) this.audioChunks.push(event.data); };
      this.mediaRecorder.start();
      this.isRecording = true;
      return true;
    } catch (err) { console.error(err); return false; }
  },

  async stopRecording() {
    if (!this.mediaRecorder || !this.isRecording) return null;
    return new Promise((resolve) => {
      this.mediaRecorder.onstop = () => {
        const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
        this.isRecording = false;
        this.mediaRecorder.stream.getTracks().forEach(track => track.stop());
        resolve(audioBlob);
      };
      this.mediaRecorder.stop();
    });
  },

  playAudio(audioBlob) {
    const url = URL.createObjectURL(audioBlob);
    const audio = new Audio(url);
    audio.onended = () => URL.revokeObjectURL(url);
    audio.play();
    return audio;
  },

  async exportAll() {
    const recordings = await this.getAllRecordings();
    return await Promise.all(recordings.map(async (r) => {
      const base64 = await this.blobToBase64(r.audioBlob);
      return { wordKey: r.wordKey, word: r.word, translation: r.translation, category: r.category, audio: base64, timestamp: r.timestamp };
    }));
  },

  blobToBase64(blob) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  },

  async importFromData(data) {
    let count = 0;
    for (const r of data) {
      try {
        const response = await fetch(r.audio);
        const blob = await response.blob();
        await this.saveRecording(r.wordKey, r.word, r.translation, r.category || 'unknown', blob);
        count++;
      } catch (e) { console.warn('Failed to import:', r.wordKey, e); }
    }
    return count;
  }
};

// ================================================================
//  VOICE UI - REDESIGNED
// ================================================================
let voiceRecordings = [];
let voiceIsRecording = false;
let voicePending = null;
let voiceFilter = 'unrecorded';

async function loadVoiceRecordings() {
  voiceRecordings = await VoiceManager.getAllRecordings();
  populateWordSelect();
  renderVoiceList();
  updateVoiceCount();
}

function populateWordSelect() {
  const select = el('voice-word-select');
  const currentVal = select.value;
  select.innerHTML = '<option value="">Select a word to record...</option>';
  
  const wordsToShow = voiceFilter === 'all' 
    ? words 
    : words.filter(w => !voiceRecordings.some(r => r.wordKey === Utils.wordKey(w)));
  
  wordsToShow.forEach(w => {
    const opt = document.createElement('option');
    opt.value = Utils.wordKey(w);
    opt.textContent = `${w.word} → ${w.translation} [${w.category}]`;
    if (opt.value === currentVal) opt.selected = true;
    select.appendChild(opt);
  });
}

function renderVoiceList() {
  const container = el('voice-list');
  
  if (voiceRecordings.length === 0) {
    container.innerHTML = `<div class="empty-state">No recordings yet. Select a word above and click Record.</div>`;
    return;
  }

  container.innerHTML = voiceRecordings.map(r => {
    const wordObj = words.find(w => Utils.wordKey(w) === r.wordKey);
    const category = wordObj ? wordObj.category : r.category;
    
    return `
    <div class="voice-item">
      <div>
        <span class="voice-word">${r.word}</span>
        <span class="voice-meta">${r.translation}</span>
        <span class="voice-meta">[${category}]</span>
        <span class="voice-meta" style="color:var(--sage);">✓ recorded</span>
      </div>
      <div class="voice-actions">
        <button class="play-btn" onclick="window.playVoice('${r.wordKey}')">▶️</button>
        <button class="delete-btn" onclick="window.deleteVoice('${r.wordKey}')">🗑️</button>
      </div>
    </div>
  `}).join('');
}

function updateVoiceCount() {
  const total = words.length;
  const recorded = voiceRecordings.length;
  el('voice-total').textContent = recorded;
  el('voice-total-words').textContent = total;
  
  const pct = total > 0 ? Math.round((recorded / total) * 100) : 0;
  el('voice-progress-bar').style.width = pct + '%';
  
  if (total === 0) {
    el('voice-status').textContent = 'No words loaded. Add words first!';
    el('voice-status').className = 'status';
  } else if (recorded === total && total > 0) {
    el('voice-status').textContent = '🎉 All words recorded!';
    el('voice-status').className = 'status success';
  } else {
    el('voice-status').textContent = `${total - recorded} words left to record`;
    el('voice-status').className = 'status';
  }
}

// ===== VOICE RECORDING =====
async function startVoiceRecording() {
  const select = el('voice-word-select');
  const wordKey = select.value;
  
  if (!wordKey) {
    el('voice-status').textContent = '⚠️ Select a word first.';
    el('voice-status').className = 'status error';
    return;
  }

  const wordObj = words.find(w => Utils.wordKey(w) === wordKey);
  if (!wordObj) {
    el('voice-status').textContent = '⚠️ Word not found in your list.';
    el('voice-status').className = 'status error';
    return;
  }

  const existing = await VoiceManager.getRecording(wordKey);
  if (existing) {
    if (!confirm(`"${wordObj.word}" already has a recording. Overwrite?`)) return;
  }

  const success = await VoiceManager.startRecording();
  if (success) {
    voiceIsRecording = true;
    voicePending = { wordKey, word: wordObj.word, translation: wordObj.translation, category: wordObj.category };
    el('voice-record-btn').textContent = '⏹️ Stop';
    el('voice-record-btn').style.background = 'var(--rust)';
    el('voice-status').innerHTML = `<span class="recording-indicator"></span> Recording "${wordObj.word}"... Click Stop when done.`;
    el('voice-status').className = 'status';
  } else {
    el('voice-status').textContent = '❌ Could not access microphone.';
    el('voice-status').className = 'status error';
  }
}

async function stopVoiceRecording() {
  const audioBlob = await VoiceManager.stopRecording();
  if (!audioBlob) return;
  if (!voicePending) return;

  await VoiceManager.saveRecording(
    voicePending.wordKey,
    voicePending.word,
    voicePending.translation,
    voicePending.category,
    audioBlob
  );

  voiceIsRecording = false;
  voicePending = null;
  el('voice-record-btn').textContent = '🔴 Record';
  el('voice-record-btn').style.background = '';
  el('voice-status').textContent = '✅ Saved!';
  el('voice-status').className = 'status success';

  await loadVoiceRecordings();
  setTimeout(() => { el('voice-status').textContent = ''; }, 3000);
}

el('voice-record-btn').addEventListener('click', () => {
  if (voiceIsRecording) { stopVoiceRecording(); }
  else { startVoiceRecording(); }
});

// ===== FILTERS =====
el('voice-filter-unrecorded').addEventListener('click', () => {
  voiceFilter = 'unrecorded';
  el('voice-filter-unrecorded').classList.add('active');
  el('voice-filter-all').classList.remove('active');
  populateWordSelect();
  renderVoiceList();
});

el('voice-filter-all').addEventListener('click', () => {
  voiceFilter = 'all';
  el('voice-filter-all').classList.add('active');
  el('voice-filter-unrecorded').classList.remove('active');
  populateWordSelect();
  renderVoiceList();
});

// ===== VOICE PLAYBACK & DELETE (global) =====
window.playVoice = async function(wordKey) {
  const record = await VoiceManager.getRecording(wordKey);
  if (record && record.audioBlob) {
    VoiceManager.playAudio(record.audioBlob);
    el('voice-status').textContent = '▶️ Playing...';
    el('voice-status').className = 'status';
    setTimeout(() => { el('voice-status').textContent = ''; }, 2000);
  }
};

window.deleteVoice = async function(wordKey) {
  if (!confirm('Delete this recording?')) return;
  await VoiceManager.deleteRecording(wordKey);
  await loadVoiceRecordings();
  el('voice-status').textContent = '🗑️ Deleted.';
  el('voice-status').className = 'status';
  setTimeout(() => { el('voice-status').textContent = ''; }, 3000);
};

// ===== VOICE EXPORT/IMPORT =====
el('voice-export-btn').addEventListener('click', async () => {
  const data = await VoiceManager.exportAll();
  if (data.length === 0) { el('voice-import-status').textContent = '⚠️ No recordings to export.'; return; }
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `voice-recordings-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  el('voice-import-status').textContent = `📤 Exported ${data.length} recordings.`;
  el('voice-import-status').className = 'status success';
  setTimeout(() => { el('voice-import-status').textContent = ''; }, 3000);
});

el('voice-import-btn').addEventListener('click', () => el('voice-import-file').click());
el('voice-import-file').addEventListener('change', async (e) => {
  if (e.target.files.length > 0) {
    try {
      const text = await e.target.files[0].text();
      const data = JSON.parse(text);
      if (!Array.isArray(data) || data.length === 0) { throw new Error('Invalid format'); }
      const count = await VoiceManager.importFromData(data);
      await loadVoiceRecordings();
      el('voice-import-status').textContent = `✅ Imported ${count} recordings.`;
      el('voice-import-status').className = 'status success';
      setTimeout(() => { el('voice-import-status').textContent = ''; }, 3000);
    } catch (err) {
      el('voice-import-status').textContent = '❌ Import failed: ' + err.message;
      el('voice-import-status').className = 'status error';
    }
  }
  e.target.value = '';
});

el('voice-delete-all-btn').addEventListener('click', async () => {
  if (!confirm('Delete ALL voice recordings? This cannot be undone!')) return;
  await VoiceManager.deleteAll();
  await loadVoiceRecordings();
  el('voice-status').textContent = '🗑️ All recordings deleted.';
  el('voice-status').className = 'status';
  setTimeout(() => { el('voice-status').textContent = ''; }, 3000);
});

// ===== KEYBOARD SHORTCUT =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && voiceIsRecording) { stopVoiceRecording(); }
});

// ================================================================
//  INIT
// ================================================================
async function init() {
  await VoiceManager.init();
  await loadVoiceRecordings();
  updateTokenSavedTag();
  refreshTable();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    el('voice-record-btn').disabled = true;
    el('voice-status').textContent = '⚠️ Microphone not supported in this browser.';
    el('voice-status').className = 'status error';
  }
}

init();
</script>
