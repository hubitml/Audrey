<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Word Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  /* (your existing styles – keep unchanged) */
  :root{
    --ink:#1B2430;
    --surface:#232E3D;
    --surface-2:#2C3849;
    --paper:#EDE6D6;
    --paper-dim:#B9B2A2;
    --amber:#E8A33D;
    --sage:#6FA97A;
    --rust:#C8563D;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    min-height:100dvh;
  }
  .app{
    width:100%;
    max-width:480px;
    padding:20px 18px 40px;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--amber);}
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-dim);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:14px;
  }
  /* --- setup screen --- */
  label.field-label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--amber);
    margin-bottom:8px;
  }
  select{
    width:100%;
    padding:14px 12px;
    border-radius:10px;
    border:1px solid var(--surface-2);
    background:var(--surface-2);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:16px;
    margin-bottom:18px;
    appearance:none;
    -webkit-appearance:none;
  }
  input[type="text"]{
    width:100%;
    padding:14px 12px;
    border-radius:10px;
    border:1px solid var(--surface-2);
    background:var(--surface-2);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:16px;
    margin-bottom:18px;
  }
  input::placeholder{color:var(--paper-dim);}
  input:focus{outline:none; border-color:var(--amber);}
  .mode-row{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .mode-btn{
    flex:1;
    padding:16px 8px;
    border-radius:10px;
    border:1.5px solid var(--surface-2);
    background:var(--surface-2);
    color:var(--paper-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    text-align:center;
  }
  .mode-btn.active{
    border-color:var(--amber);
    color:var(--amber);
    background:rgba(232,163,61,0.08);
  }
  .cat-toggle{
    width:100%;
    padding:14px 12px;
    border-radius:10px;
    border:1px solid var(--surface-2);
    background:var(--surface-2);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:16px;
    margin-bottom:0;
    text-align:left;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .cat-toggle .chev{color:var(--paper-dim); font-size:12px;}
  #category-options{
    background:var(--surface-2);
    border-radius:0 0 10px 10px;
    padding:6px 12px 10px;
    margin-bottom:18px;
  }
  #category-options.hidden{display:none;}
  label.cat-check{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--paper);
    border-top:1px solid rgba(237,230,214,0.08);
  }
  label.cat-check:first-child{border-top:none;}
  label.cat-check input{accent-color:var(--amber); width:17px; height:17px;}
  .primary-btn{
    width:100%;
    padding:16px;
    border-radius:10px;
    border:none;
    background:var(--amber);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
  }
  .primary-btn:active{opacity:0.85;}
  .ghost-btn{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1.5px solid var(--surface-2);
    background:transparent;
    color:var(--paper-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
  }
  .hidden{display:none !important;}
  /* --- progress --- */
  .progress-bar{
    height:5px;
    background:var(--surface-2);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .progress-fill{
    height:100%;
    background:var(--amber);
    width:0%;
    transition:width 0.25s ease;
  }
  .score-row{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--paper-dim);
    margin-bottom:16px;
  }
  /* --- MC screen --- */
  .word-display{
    font-family:'Fraunces',serif;
    font-size:34px;
    font-weight:700;
    text-align:center;
    padding:30px 10px;
    margin-bottom:6px;
  }
  .word-caption{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-dim);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:18px;
  }
  .option-btn{
    width:100%;
    padding:16px;
    margin-bottom:10px;
    border-radius:10px;
    border:1.5px solid var(--surface-2);
    background:var(--surface-2);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:16px;
    text-align:left;
    cursor:pointer;
  }
  .option-btn.correct{border-color:var(--sage); background:rgba(111,169,122,0.15); color:var(--sage);}
  .option-btn.wrong{border-color:var(--rust); background:rgba(200,86,61,0.15); color:var(--rust);}
  .option-btn:disabled{cursor:default;}
  /* --- match screen --- */
  .match-grid{
    display:flex;
    gap:10px;
  }
  .match-col{flex:1; display:flex; flex-direction:column; gap:8px;}
  .match-item{
    padding:14px 10px;
    border-radius:10px;
    border:1.5px solid var(--surface-2);
    background:var(--surface-2);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
    text-align:center;
    cursor:pointer;
    min-height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    word-break:break-word;
  }
  .match-item.selected{border-color:var(--amber); color:var(--amber);}
  .match-item.matched{border-color:var(--sage); color:var(--sage); background:rgba(111,169,122,0.1); opacity:0.55; cursor:default;}
  .match-item.wrong-flash{border-color:var(--rust); animation:shake 0.3s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  /* --- end screen --- */
  .end-score{
    font-family:'Fraunces',serif;
    font-size:48px;
    font-weight:700;
    text-align:center;
    color:var(--amber);
    margin:10px 0 2px;
  }
  .end-caption{
    text-align:center;
    color:var(--paper-dim);
    font-size:14px;
    margin-bottom:20px;
  }
  .stats-cols{
    display:flex;
    gap:12px;
  }
  .stat-col{
    flex:1;
    text-align:center;
    background:var(--surface-2);
    border-radius:10px;
    padding:16px 8px;
  }
  .stat-mode{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--paper-dim);
    margin-bottom:8px;
  }
  .stat-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:22px;
    color:var(--paper);
  }
  .stat-acc{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--sage);
    margin-top:2px;
  }
  .history-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-top:1px solid var(--surface-2);
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .history-mode{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    color:var(--amber);
    margin-right:8px;
  }
  .history-cat{
    color:var(--paper-dim);
    font-size:12px;
  }
  .history-score{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
  }
  .history-empty{
    text-align:center;
    color:var(--paper-dim);
    font-size:12px;
    padding:10px 0;
  }
  .status-msg{
    text-align:center;
    font-size:12px;
    color:var(--paper-dim);
    margin-top:6px;
  }
  .status-msg.error{color:var(--rust);}
  .status-msg.success{color:var(--sage);}
  footer{
    margin-top:auto;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--surface-2);
    padding-top:20px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Word<span>Drills</span></h1>
    <div class="tag" id="header-tag">login</div>
  </header>

  <!-- LOGIN SCREEN -->
  <div class="card" id="screen-login">
    <label class="field-label">Who's playing?</label>
    <input type="text" id="login-input" placeholder="Type your name" autocomplete="off">
    <button class="primary-btn" id="login-btn">Continue</button>
    <div id="login-status" class="status-msg"></div>
  </div>

  <!-- SETUP SCREEN -->
  <div class="hidden card" id="screen-setup">
    <label class="field-label">Categories</label>
    <div class="cat-toggle" id="category-toggle">
      <span id="category-summary">All categories</span>
      <span class="chev">▾</span>
    </div>
    <div id="category-options"></div>

    <label class="field-label">Mode</label>
    <div class="mode-row">
      <div class="mode-btn active" data-mode="mc">Multiple Choice</div>
      <div class="mode-btn" data-mode="match">Matching</div>
    </div>

    <label class="field-label">Length</label>
    <div class="mode-row" id="mc-length-row">
      <div class="mode-btn length-btn" data-len="10">10</div>
      <div class="mode-btn length-btn active" data-len="15">15</div>
      <div class="mode-btn length-btn" data-len="20">20</div>
    </div>
    <div class="mode-row hidden" id="match-length-row">
      <div class="mode-btn length-btn" data-len="6">6</div>
      <div class="mode-btn length-btn active" data-len="12">12</div>
      <div class="mode-btn length-btn" data-len="18">18</div>
    </div>

    <button class="primary-btn" id="start-btn">Start</button>
    <div id="setup-status" class="status-msg"></div>
  </div>

  <!-- HISTORY CARD -->
  <div class="hidden card" id="history-card">
    <div class="tag" style="text-align:center; margin-bottom:16px;">History</div>
    <div class="stats-cols">
      <div class="stat-col">
        <div class="stat-mode">Multiple Choice</div>
        <div class="stat-num" id="stat-mc-num">0/0</div>
        <div class="stat-acc" id="stat-mc-acc">0%</div>
      </div>
      <div class="stat-col">
        <div class="stat-mode">Matching</div>
        <div class="stat-num" id="stat-match-num">0/0</div>
        <div class="stat-acc" id="stat-match-acc">0%</div>
      </div>
    </div>
    <div class="tag" style="margin:20px 0 8px;">Recent sessions</div>
    <div id="history-list"></div>
    <button class="ghost-btn" id="logout-btn" style="margin-top:16px;">Switch user</button>
    <div id="save-status" class="status-msg" style="margin-top:8px;"></div>
  </div>

  <!-- MC SCREEN -->
  <div class="hidden" id="screen-mc">
    <div class="progress-bar"><div class="progress-fill" id="mc-progress"></div></div>
    <div class="score-row">
      <span id="mc-count">0 / 0</span>
      <span id="mc-score">Score: 0</span>
    </div>
    <div class="card">
      <div class="word-display" id="mc-word"></div>
      <div class="word-caption" id="mc-category"></div>
    </div>
    <div id="mc-options"></div>
  </div>

  <!-- MATCH SCREEN -->
  <div class="hidden" id="screen-match">
    <div class="progress-bar"><div class="progress-fill" id="match-progress"></div></div>
    <div class="score-row">
      <span id="match-count">Round 1</span>
      <span id="match-score">Score: 0</span>
    </div>
    <div class="match-grid">
      <div class="match-col" id="match-left"></div>
      <div class="match-col" id="match-right"></div>
    </div>
  </div>

  <!-- END SCREEN -->
  <div class="hidden card" id="screen-end">
    <div class="tag" style="text-align:center;">session complete</div>
    <div class="end-score" id="end-score">0%</div>
    <div class="end-caption" id="end-caption"></div>
    <button class="primary-btn" id="replay-btn">Play Again</button>
    <button class="ghost-btn" id="change-settings-btn">Change Settings</button>
  </div>

  <footer>made for two — edit words in editor.html</footer>
</div>

<script>
// -------------------- FIREBASE CONFIG --------------------
const firebaseConfig = {
  apiKey: "AIzaSyD5kV-BApIMmiJItiBsgDMrsyxKpFh1OI4",
  authDomain: "placcounts.firebaseapp.com",
  projectId: "placcounts",
  storageBucket: "placcounts.firebasestorage.app",
  messagingSenderId: "738608257101",
  appId: "1:738608257101:web:50c11dd49b86ba08b2a404"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Sign in anonymously so Firestore rules allow writes
auth.signInAnonymously()
  .then(() => {
    console.log('Signed in anonymously');
    el('login-status').textContent = 'Connected to Firestore';
    el('login-status').className = 'status-msg success';
  })
  .catch(err => {
    console.error('Auth error:', err);
    el('login-status').textContent = '⚠️ Firestore auth failed – data may not save. Check console.';
    el('login-status').className = 'status-msg error';
  });

// Enable offline persistence
db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn('Persistence:', err));

// -------------------- weighting constants --------------------
const K = 0.25;
const FLOOR = 0.05;
const COOLDOWN_FRACTION = 0.5;
const MATCH_ROUND_WORTH = 4;

// -------------------- GLOBALS --------------------
let ALL_WORDS = [];
let settings = { categories: [], mode: 'mc', sessionLength: 15 };
let currentUser = null;

const el = id => document.getElementById(id);

// -------------------- LOGIN --------------------
el('login-btn').addEventListener('click', attemptLogin);
el('login-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') attemptLogin();
});

function attemptLogin() {
  const name = el('login-input').value.trim();
  if (!name) {
    el('login-status').textContent = 'Please enter your name.';
    el('login-status').className = 'status-msg error';
    return;
  }
  currentUser = name;
  el('header-tag').textContent = name;
  el('login-status').textContent = '';
  el('login-status').className = 'status-msg';
  afterLogin();
}

// -------------------- SWITCH USER / LOGOUT --------------------
el('logout-btn').addEventListener('click', () => {
  currentUser = null;
  el('login-input').value = '';
  showScreen('login');
  el('header-tag').textContent = 'login';
  // clear history
  el('stat-mc-num').textContent = '0/0';
  el('stat-mc-acc').textContent = '0%';
  el('stat-match-num').textContent = '0/0';
  el('stat-match-acc').textContent = '0%';
  el('history-list').innerHTML = '<div class="history-empty">Sign in to see history</div>';
});

// -------------------- LOAD WORDS --------------------
fetch('words.json')
  .then(r => r.json())
  .then(data => {
    ALL_WORDS = data;
    populateCategories();
    el('setup-status').textContent = ALL_WORDS.length + ' words loaded';
    if (currentUser) afterLogin();
  })
  .catch(() => {
    el('setup-status').textContent = 'Could not load words.json — check it is in the same folder.';
    el('setup-status').className = 'status-msg error';
    if (currentUser) afterLogin();
  });

function populateCategories() {
  const cats = [...new Set(ALL_WORDS.map(w => w.category))].sort();
  const panel = el('category-options');
  panel.innerHTML = cats.map(c =>
    `<label class="cat-check"><input type="checkbox" class="cat-checkbox" value="${c}" checked> ${capitalize(c)}</label>`
  ).join('');
  settings.categories = cats.slice();
  updateCategorySummary();
  panel.querySelectorAll('.cat-checkbox').forEach(cb => {
    cb.addEventListener('change', () => {
      settings.categories = [...panel.querySelectorAll('.cat-checkbox:checked')].map(c => c.value);
      updateCategorySummary();
    });
  });
}
function updateCategorySummary(){
  const allCats = [...new Set(ALL_WORDS.map(w => w.category))];
  const summary = el('category-summary');
  if (settings.categories.length === 0) summary.textContent = 'Select at least one';
  else if (settings.categories.length === allCats.length) summary.textContent = 'All categories';
  else summary.textContent = settings.categories.map(capitalize).join(', ');
}
el('category-toggle').addEventListener('click', () => {
  el('category-options').classList.toggle('hidden');
});
function getActivePool(){
  return ALL_WORDS.filter(w => settings.categories.includes(w.category));
}
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function shuffle(arr){ return [...arr].sort(() => Math.random() - 0.5); }

// -------------------- AFTER LOGIN --------------------
async function afterLogin() {
  if (!currentUser) return;
  el('setup-status').textContent = 'Loading progress...';
  el('setup-status').className = 'status-msg';
  await loadWordStatsFromFirestore();
  el('setup-status').textContent = '';
  showScreen('setup');
  loadHistoryFromFirestore();
}

// -------------------- PER-WORD STATS --------------------
let wordStatsCache = {};
let categoryRoundsCache = {};
let statsLoaded = false;
let saveTimer = null;

function wordKey(item){ return item.word + '|' + item.translation; }
function wordStatsDocRef(){ return db.collection('wordStats').doc(currentUser); }

async function loadWordStatsFromFirestore(){
  statsLoaded = false;
  try {
    const snap = await wordStatsDocRef().get();
    const data = snap.exists ? snap.data() : {};
    wordStatsCache = data.words || {};
    categoryRoundsCache = data.categoryRounds || {};
    statsLoaded = true;
  } catch(e){
    console.error('Failed to load word stats from Firestore', e);
    wordStatsCache = {};
    categoryRoundsCache = {};
    statsLoaded = true; // still allow play, but warn
    el('setup-status').textContent = '⚠️ Could not load progress. Data may not save.';
    el('setup-status').className = 'status-msg error';
  }
}

function scheduleSaveWordStats(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveWordStatsToFirestore, 800);
}
async function saveWordStatsToFirestore(){
  try {
    await wordStatsDocRef().set({ words: wordStatsCache, categoryRounds: categoryRoundsCache });
    el('save-status').textContent = '✓ Progress saved';
    el('save-status').className = 'status-msg success';
    setTimeout(() => { el('save-status').textContent = ''; }, 2000);
  } catch(e){
    console.error('Failed to save word stats to Firestore', e);
    el('save-status').textContent = '❌ Failed to save progress. Check console.';
    el('save-status').className = 'status-msg error';
  }
}

function getOrCreateWordStat(item){
  const key = wordKey(item);
  if (!wordStatsCache[key]){
    wordStatsCache[key] = {
      word: item.word, translation: item.translation, category: item.category,
      pCorrect: 0, pIncorrect: 0, testCorrect: 0, testIncorrect: 0,
      lastCorrectMark: 0, lastSeen: 0
    };
  }
  return wordStatsCache[key];
}

function recordWordAttempt(item, correct){
  if (!item) return;
  const w = getOrCreateWordStat(item);
  if (correct) w.pCorrect++; else w.pIncorrect++;
  w.category = item.category;
  w.lastSeen = Date.now();
  if (correct) w.lastCorrectMark = categoryRoundsCache[item.category] || 0;
  scheduleSaveWordStats();
}

function incrementCategoryRounds(categories, amount){
  categories.forEach(c => { categoryRoundsCache[c] = (categoryRoundsCache[c] || 0) + amount; });
  scheduleSaveWordStats();
}

// -------------------- weighting functions --------------------
function practiceMastery(item){
  const w = wordStatsCache[wordKey(item)];
  const pCorrect = w ? w.pCorrect : 0;
  const pIncorrect = w ? w.pIncorrect : 0;
  return (pCorrect + 1) / (pCorrect + pIncorrect + 2);
}
function mastery(item){
  const w = wordStatsCache[wordKey(item)];
  const testCorrect = w ? w.testCorrect : 0;
  const testIncorrect = w ? w.testIncorrect : 0;
  const pm = practiceMastery(item);
  return (testCorrect + K * pm + 1) / (testCorrect + testIncorrect + K + 2);
}
function selectionWeight(item, poolSize){
  const w = wordStatsCache[wordKey(item)];
  const pm = practiceMastery(item);
  const cooldown = Math.max(1, poolSize * COOLDOWN_FRACTION);
  const roundsSince = (categoryRoundsCache[item.category] || 0) - (w ? (w.lastCorrectMark || 0) : 0);
  const recencyFactor = Math.min(1, Math.max(0, roundsSince / cooldown));
  return FLOOR + (1 - FLOOR) * (1 - pm) * recencyFactor;
}
function weightedSampleWithoutReplacement(items, weightFn, n){
  const pool = items.slice();
  const picked = [];
  const count = Math.min(n, pool.length);
  for (let i = 0; i < count; i++){
    const weights = pool.map(weightFn);
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    let idx = pool.length - 1;
    for (let j = 0; j < weights.length; j++){
      r -= weights[j];
      if (r <= 0){ idx = j; break; }
    }
    picked.push(pool[idx]);
    pool.splice(idx, 1);
  }
  return picked;
}

// -------------------- HISTORY --------------------
function getUserSessionsRef() {
  return db.collection('users').doc(currentUser).collection('sessions');
}

async function loadHistoryFromFirestore() {
  try {
    const snapshot = await getUserSessionsRef()
      .orderBy('timestamp', 'desc')
      .limit(50)
      .get();
    const sessions = [];
    snapshot.forEach(doc => sessions.push(doc.data()));
    renderHistoryUI(sessions);
  } catch (err) {
    console.warn('Error loading history:', err);
    el('history-list').innerHTML = '<div class="history-empty">Could not load history</div>';
  }
}

async function recordSession(mode, categories, correct, total) {
  if (total <= 0 || !currentUser) return;
  const session = {
    mode,
    categories,
    correct,
    total,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    await getUserSessionsRef().add(session);
    loadHistoryFromFirestore();
  } catch (err) {
    console.warn('Failed to save session:', err);
  }
}

function renderHistoryUI(history) {
  const agg = { mc: { correct: 0, total: 0 }, match: { correct: 0, total: 0 } };
  history.forEach(h => {
    if (agg[h.mode]) {
      agg[h.mode].correct += h.correct;
      agg[h.mode].total += h.total;
    }
  });
  el('stat-mc-num').textContent = agg.mc.correct + '/' + agg.mc.total;
  el('stat-mc-acc').textContent = (agg.mc.total ? Math.round(agg.mc.correct / agg.mc.total * 100) : 0) + '%';
  el('stat-match-num').textContent = agg.match.correct + '/' + agg.match.total;
  el('stat-match-acc').textContent = (agg.match.total ? Math.round(agg.match.correct / agg.match.total * 100) : 0) + '%';

  const container = el('history-list');
  if (history.length === 0) {
    container.innerHTML = '<div class="history-empty">No sessions yet</div>';
    return;
  }
  const modeLabel = m => m === 'mc' ? 'MC' : 'Matching';
  const allCats = [...new Set(ALL_WORDS.map(w => w.category))];
  const catLabel = cats => {
    if (!Array.isArray(cats)) return cats === 'all' ? 'All' : capitalize(cats);
    if (cats.length === allCats.length) return 'All';
    return cats.map(capitalize).join(', ');
  };
  container.innerHTML = history.map(h =>
    `<div class="history-row">
      <span><span class="history-mode">${modeLabel(h.mode)}</span><span class="history-score">${h.correct}/${h.total}</span></span>
      <span class="history-cat">${catLabel(h.categories !== undefined ? h.categories : h.category)}</span>
    </div>`
  ).join('');
}

// -------------------- UI HELPERS --------------------
function showScreen(name) {
  ['login','setup','mc','match','end'].forEach(s => el('screen-' + s).classList.add('hidden'));
  el('screen-' + name).classList.remove('hidden');
  el('header-tag').textContent = (name === 'login') ? 'login' : (name === 'setup' ? currentUser || 'setup' : name);
  el('history-card').classList.toggle('hidden', name !== 'setup');
}

// -------------------- MODE & LENGTH TOGGLES --------------------
document.querySelectorAll('.mode-row .mode-btn[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-row .mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.mode = btn.dataset.mode;
    el('mc-length-row').classList.toggle('hidden', settings.mode !== 'mc');
    el('match-length-row').classList.toggle('hidden', settings.mode !== 'match');
    const activeRow = settings.mode === 'mc' ? el('mc-length-row') : el('match-length-row');
    const activeBtn = activeRow.querySelector('.length-btn.active') || activeRow.querySelector('.length-btn');
    activeRow.querySelectorAll('.length-btn').forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');
    settings.sessionLength = parseInt(activeBtn.dataset.len, 10);
  });
});

function bindLengthButtons(row){
  row.querySelectorAll('.length-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      row.querySelectorAll('.length-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      settings.sessionLength = parseInt(btn.dataset.len, 10);
    });
  });
}
bindLengthButtons(el('mc-length-row'));
bindLengthButtons(el('match-length-row'));

// -------------------- START --------------------
el('start-btn').addEventListener('click', () => {
  if (!currentUser) { return; }
  if (!statsLoaded){
    el('setup-status').textContent = 'Still loading progress, one sec...';
    el('setup-status').className = 'status-msg';
    return;
  }
  if (settings.categories.length === 0){
    el('setup-status').textContent = 'Select at least one category.';
    el('setup-status').className = 'status-msg error';
    return;
  }
  const pool = getActivePool();
  if (settings.mode === 'mc'){
    if (pool.length < 2){
      el('setup-status').textContent = 'Need at least 2 words in selected categories.';
      el('setup-status').className = 'status-msg error';
      return;
    }
    startMC(pool);
  } else {
    if (pool.length < ROUND_SIZE){
      el('setup-status').textContent = 'Need at least ' + ROUND_SIZE + ' words for matching.';
      el('setup-status').className = 'status-msg error';
      return;
    }
    startMatch(pool);
  }
});

// ================= MULTIPLE CHOICE =================
let mcQueue = [], mcIndex = 0, mcScore = 0, mcPool = [], mcActiveCats = [];

function startMC(pool) {
  mcPool = pool;
  mcActiveCats = settings.categories.slice();
  mcQueue = weightedSampleWithoutReplacement(pool, w => selectionWeight(w, pool.length), settings.sessionLength);
  mcIndex = 0;
  mcScore = 0;
  showScreen('mc');
  renderMC();
}

function renderMC() {
  if (mcIndex >= mcQueue.length) {
    endSession(mcScore, mcQueue.length);
    return;
  }
  incrementCategoryRounds(mcActiveCats, 1);
  const item = mcQueue[mcIndex];
  el('mc-word').textContent = item.word;
  el('mc-category').textContent = item.category;
  el('mc-count').textContent = (mcIndex + 1) + ' / ' + mcQueue.length;
  el('mc-score').textContent = 'Score: ' + mcScore;
  el('mc-progress').style.width = ((mcIndex) / mcQueue.length * 100) + '%';

  const distractors = shuffle(mcPool.filter(w => w.translation !== item.translation)).slice(0, 3);
  const options = shuffle([item, ...distractors]);

  const container = el('mc-options');
  container.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.translation;
    btn.addEventListener('click', () => handleMCAnswer(btn, opt, item, container));
    container.appendChild(btn);
  });
}

function handleMCAnswer(btn, opt, correctItem, container) {
  const buttons = container.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);
  const isCorrect = opt.translation === correctItem.translation;
  if (isCorrect) {
    btn.classList.add('correct');
    mcScore++;
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b => { if (b.textContent === correctItem.translation) b.classList.add('correct'); });
  }
  recordWordAttempt(correctItem, isCorrect);
  setTimeout(() => { mcIndex++; renderMC(); }, 650);
}

// ================= MATCHING =================
let matchPool = [], matchRoundWords = [], matchScore = 0, matchTotal = 0, matchActiveCats = [];
let matchLeftSel = null, matchRightSel = null, matchedCount = 0;
const ROUND_SIZE = 6;

function startMatch(pool) {
  matchActiveCats = settings.categories.slice();
  const targetLen = Math.floor(Math.min(settings.sessionLength, pool.length) / ROUND_SIZE) * ROUND_SIZE;
  matchPool = weightedSampleWithoutReplacement(pool, w => selectionWeight(w, pool.length), targetLen);
  matchScore = 0;
  matchTotal = 0;
  showScreen('match');
  nextMatchRound();
}

function nextMatchRound() {
  if (matchPool.length < ROUND_SIZE) {
    endSession(matchScore, matchTotal);
    return;
  }
  matchRoundWords = matchPool.splice(0, ROUND_SIZE);
  incrementCategoryRounds(matchActiveCats, MATCH_ROUND_WORTH);
  matchedCount = 0;
  matchLeftSel = null;
  matchRightSel = null;
  renderMatch();
}

function renderMatch() {
  const total = matchRoundWords.length;
  el('match-count').textContent = 'Round: ' + total + ' pairs, ' + (matchPool.length) + ' left after';
  el('match-score').textContent = 'Score: ' + matchScore;
  el('match-progress').style.width = (matchedCount / total * 100) + '%';

  const leftItems = shuffle(matchRoundWords);
  const rightItems = shuffle(matchRoundWords);

  const leftCol = el('match-left');
  const rightCol = el('match-right');
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  leftItems.forEach(item => {
    const d = document.createElement('div');
    d.className = 'match-item';
    d.textContent = item.word;
    d.dataset.key = item.word + '|' + item.translation;
    d.addEventListener('click', () => selectMatch('left', d, item));
    leftCol.appendChild(d);
  });
  rightItems.forEach(item => {
    const d = document.createElement('div');
    d.className = 'match-item';
    d.textContent = item.translation;
    d.dataset.key = item.word + '|' + item.translation;
    d.addEventListener('click', () => selectMatch('right', d, item));
    rightCol.appendChild(d);
  });
}

function selectMatch(side, node, item) {
  if (node.classList.contains('matched')) return;

  if (side === 'left') {
    if (matchLeftSel) matchLeftSel.node.classList.remove('selected');
    matchLeftSel = { node, item };
    node.classList.add('selected');
  } else {
    if (matchRightSel) matchRightSel.node.classList.remove('selected');
    matchRightSel = { node, item };
    node.classList.add('selected');
  }

  if (matchLeftSel && matchRightSel) {
    const isMatch = matchLeftSel.item.word === matchRightSel.item.word;
    const leftItem = matchLeftSel.item, rightItem = matchRightSel.item;
    if (isMatch) {
      matchLeftSel.node.classList.remove('selected');
      matchRightSel.node.classList.remove('selected');
      matchLeftSel.node.classList.add('matched');
      matchRightSel.node.classList.add('matched');
      matchScore++;
      matchTotal++;
      matchedCount++;
      matchLeftSel = null;
      matchRightSel = null;
      recordWordAttempt(leftItem, true);
      el('match-progress').style.width = (matchedCount / matchRoundWords.length * 100) + '%';
      el('match-score').textContent = 'Score: ' + matchScore;
      if (matchedCount === matchRoundWords.length) {
        setTimeout(nextMatchRound, 500);
      }
    } else {
      matchTotal++;
      recordWordAttempt(leftItem, false);
      recordWordAttempt(rightItem, false);
      const l = matchLeftSel.node, r = matchRightSel.node;
      l.classList.add('wrong-flash');
      r.classList.add('wrong-flash');
      setTimeout(() => {
        l.classList.remove('selected','wrong-flash');
        r.classList.remove('selected','wrong-flash');
        matchLeftSel = null;
        matchRightSel = null;
      }, 350);
    }
  }
}

// ================= END =================
function endSession(score, total) {
  showScreen('end');
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  el('end-score').textContent = pct + '%';
  el('end-caption').textContent = score + ' correct out of ' + total;
  recordSession(settings.mode, settings.categories.slice(), score, total);
  // Force a save immediately to ensure word stats are written
  saveWordStatsToFirestore();
}

el('replay-btn').addEventListener('click', () => {
  if (!currentUser) return;
  const pool = getActivePool();
  if (settings.mode === 'mc') startMC(pool);
  else startMatch(pool);
});

el('change-settings-btn').addEventListener('click', () => showScreen('setup'));
</script>
