<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Word Drills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    /* ============================================================
       CSS VARIABLES
       ============================================================ */
    :root {
      --ink: #1B2430;
      --surface: #232E3D;
      --surface-2: #2C3849;
      --paper: #EDE6D6;
      --paper-dim: #B9B2A2;
      --amber: #E8A33D;
      --sage: #6FA97A;
      --rust: #C8563D;
      --radius: 14px;
      --heart-color: #E74C3C;
      --heart-empty: #4A4A5A;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html,
    body {
      height: 100%;
    }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100dvh;
    }
    .app {
      width: 100%;
      max-width: 480px;
      padding: 20px 18px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 26px;
      margin: 0;
      letter-spacing: -0.01em;
    }
    h1 span {
      color: var(--amber);
    }
    .tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--paper-dim);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ============================================================
       CARDS
       ============================================================ */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 14px;
    }

    /* ============================================================
       FORM ELEMENTS
       ============================================================ */
    label.field-label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--amber);
      margin-bottom: 8px;
    }
    select,
    input[type="text"] {
      width: 100%;
      padding: 14px 12px;
      border-radius: 10px;
      border: 1px solid var(--surface-2);
      background: var(--surface-2);
      color: var(--paper);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      margin-bottom: 18px;
    }
    select {
      appearance: none;
      -webkit-appearance: none;
    }
    input::placeholder {
      color: var(--paper-dim);
    }
    input:focus {
      outline: none;
      border-color: var(--amber);
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .primary-btn {
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      border: none;
      background: var(--amber);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .primary-btn:active {
      opacity: 0.85;
    }
    .primary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ghost-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1.5px solid var(--surface-2);
      background: transparent;
      color: var(--paper-dim);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .ghost-btn:hover {
      border-color: var(--paper-dim);
      color: var(--paper);
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    .button-group .ghost-btn {
      margin-top: 0;
      flex: 1;
    }

    .mode-btn {
      flex: 1;
      padding: 16px 8px;
      border-radius: 10px;
      border: 1.5px solid var(--surface-2);
      background: var(--surface-2);
      color: var(--paper-dim);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .mode-btn.active {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(232, 163, 61, 0.08);
    }
    .mode-btn:not(.active):hover {
      border-color: var(--paper-dim);
      color: var(--paper);
    }
    .mode-row {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    /* ============================================================
       CATEGORY TOGGLE
       ============================================================ */
    .cat-toggle {
      width: 100%;
      padding: 14px 12px;
      border-radius: 10px;
      border: 1px solid var(--surface-2);
      background: var(--surface-2);
      color: var(--paper);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      margin-bottom: 0;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cat-toggle .chev {
      color: var(--paper-dim);
      font-size: 12px;
    }
    #category-options {
      background: var(--surface-2);
      border-radius: 0 0 10px 10px;
      padding: 6px 12px 10px;
      margin-bottom: 18px;
    }
    #category-options.hidden {
      display: none;
    }
    label.cat-check {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--paper);
      border-top: 1px solid rgba(237, 230, 214, 0.08);
    }
    label.cat-check:first-child {
      border-top: none;
    }
    label.cat-check input {
      accent-color: var(--amber);
      width: 17px;
      height: 17px;
    }
    .setup-warning {
      font-size: 12px;
      color: var(--rust);
      text-align: center;
      margin-bottom: 12px;
      min-height: 20px;
    }

    /* ============================================================
       PROGRESS & SCORE
       ============================================================ */
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--paper-dim);
      margin-bottom: 16px;
    }
    .hearts-display {
      display: flex;
      gap: 4px;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .heart-filled {
      color: var(--heart-color);
    }
    .heart-empty {
      color: var(--heart-empty);
    }

    /* ============================================================
       MC SCREEN
       ============================================================ */
    .word-display {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 700;
      text-align: center;
      padding: 30px 10px 10px;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .word-caption {
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--paper-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
      min-height: 20px;
      transition: all 0.3s;
    }
    .word-caption.revealed {
      color: var(--amber);
      font-weight: 600;
    }

    .option-btn {
      width: 100%;
      padding: 16px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1.5px solid var(--surface-2);
      background: var(--surface-2);
      color: var(--paper);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .option-btn .speaker-icon {
      font-size: 18px;
      cursor: pointer;
      color: var(--amber);
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .option-btn .speaker-icon:hover {
      transform: scale(1.2);
    }
    .option-btn .speaker-icon.playing {
      animation: pulse 0.5s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .option-btn.correct {
      border-color: var(--sage);
      background: rgba(111, 169, 122, 0.15);
      color: var(--sage);
    }
    .option-btn.wrong {
      border-color: var(--rust);
      background: rgba(200, 86, 61, 0.15);
      color: var(--rust);
    }
    .option-btn.used {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--surface-2);
    }
    .option-btn:disabled {
      cursor: default;
    }
    .option-btn:not(:disabled):hover {
      border-color: var(--paper-dim);
    }
    .option-btn .option-text {
      flex: 1;
    }

    .speaker-icon {
      font-size: 20px;
      cursor: pointer;
      color: var(--amber);
      transition: all 0.2s;
      display: inline-block;
    }
    .speaker-icon:hover {
      transform: scale(1.2);
    }
    .speaker-icon.playing {
      animation: pulse 0.5s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .reveal-btn {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1.5px dashed var(--surface-2);
      background: transparent;
      color: var(--paper-dim);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reveal-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
    }
    .reveal-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .mc-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .mc-actions .ghost-btn {
      margin-top: 0;
      flex: 1;
      padding: 12px;
      font-size: 13px;
    }

    /* ============================================================
       MATCH SCREEN
       ============================================================ */
    .match-grid {
      display: flex;
      gap: 10px;
    }
    .match-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .match-item {
      padding: 14px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--surface-2);
      background: var(--surface-2);
      color: var(--paper);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      transition: all 0.2s;
      gap: 8px;
    }
    .match-item .speaker-icon {
      font-size: 16px;
      color: var(--amber);
    }
    .match-item.selected {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(232, 163, 61, 0.08);
    }
    .match-item.matched-correct {
      border-color: var(--sage);
      color: var(--sage);
      background: rgba(111, 169, 122, 0.15);
      opacity: 0.6;
      cursor: default;
    }
    .match-item.matched-failed {
      border-color: var(--rust);
      color: var(--rust);
      background: rgba(200, 86, 61, 0.15);
      opacity: 0.5;
      cursor: default;
    }
    .match-item.wrong-flash {
      border-color: var(--rust);
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* ============================================================
       END SCREEN
       ============================================================ */
    .end-score {
      font-family: 'Fraunces', serif;
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      color: var(--amber);
      margin: 10px 0 2px;
    }
    .end-caption {
      text-align: center;
      color: var(--paper-dim);
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* ============================================================
       HISTORY
       ============================================================ */
    .stats-cols {
      display: flex;
      gap: 12px;
    }
    .stat-col {
      flex: 1;
      text-align: center;
      background: var(--surface-2);
      border-radius: 10px;
      padding: 16px 8px;
    }
    .stat-mode {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--paper-dim);
      margin-bottom: 8px;
    }
    .stat-num {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--paper);
    }
    .stat-acc {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--sage);
      margin-top: 2px;
    }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--surface-2);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
    }
    .history-mode {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      color: var(--amber);
      margin-right: 8px;
    }
    .history-cat {
      color: var(--paper-dim);
      font-size: 12px;
    }
    .history-score {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
    }
    .history-empty {
      text-align: center;
      color: var(--paper-dim);
      font-size: 12px;
      padding: 10px 0;
    }

    /* ============================================================
       STATUS & FOOTER
       ============================================================ */
    .status-msg {
      text-align: center;
      font-size: 12px;
      color: var(--paper-dim);
      margin-top: 6px;
      min-height: 20px;
    }
    .status-msg.error {
      color: var(--rust);
    }
    .status-msg.success {
      color: var(--sage);
    }

    .quit-btn {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--rust);
      background: transparent;
      color: var(--rust);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .quit-btn:hover {
      background: rgba(200, 86, 61, 0.1);
    }

    footer {
      margin-top: auto;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--surface-2);
      padding-top: 20px;
    }

    /* ============================================================
       UTILITY
       ============================================================ */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== HEADER ===== -->
    <header>
      <h1>Word<span>Drills</span></h1>
      <div class="tag" id="header-tag">login</div>
    </header>

    <!-- ===== LOGIN SCREEN ===== -->
    <div class="card" id="screen-login">
      <label class="field-label">Who's playing?</label>
      <input type="text" id="login-input" placeholder="Type your name" autocomplete="off">
      <button class="primary-btn" id="login-btn">Continue</button>
      <div id="login-status" class="status-msg"></div>
    </div>

    <!-- ===== SETUP SCREEN ===== -->
    <div class="hidden card" id="screen-setup">
      <label class="field-label">Mode</label>
      <div class="mode-row" id="mode-row">
        <div class="mode-btn active" data-mode="mc">Multiple Choice</div>
        <div class="mode-btn" data-mode="verbs">Verbs</div>
      </div>

      <div id="category-section">
        <label class="field-label">Categories</label>
        <div class="cat-toggle" id="category-toggle">
          <span id="category-summary">All categories</span>
          <span class="chev">▾</span>
        </div>
        <div id="category-options"></div>
        <div id="category-warning" class="setup-warning"></div>
      </div>

      <label class="field-label">MC Type</label>
      <div class="mode-row" id="mc-type-row">
        <div class="mode-btn mc-type-btn active" data-mctype="normal">Normal</div>
        <div class="mode-btn mc-type-btn" data-mctype="reversed">Reversed</div>
        <div class="mode-btn mc-type-btn" data-mctype="category">Category</div>
      </div>

      <button class="primary-btn" id="start-btn">Start</button>
      <div id="setup-status" class="status-msg"></div>
    </div>

    <!-- ===== HISTORY CARD ===== -->
    <div class="hidden card" id="history-card">
      <div class="tag" style="text-align:center; margin-bottom:16px;">History</div>
      <div class="stats-cols">
        <div class="stat-col">
          <div class="stat-mode">Multiple Choice</div>
          <div class="stat-num" id="stat-mc-num">0/0</div>
          <div class="stat-acc" id="stat-mc-acc">0%</div>
        </div>
        <div class="stat-col">
          <div class="stat-mode">Verbs</div>
          <div class="stat-num" id="stat-verbs-num">0/0</div>
          <div class="stat-acc" id="stat-verbs-acc">0%</div>
        </div>
      </div>
      <div class="tag" style="margin:20px 0 8px;">Recent sessions</div>
      <div id="history-list"></div>
      <div class="button-group">
        <button class="ghost-btn" id="stats-btn">📊 Stats</button>
        <button class="ghost-btn" id="logout-btn">Switch user</button>
      </div>
      <div id="save-status" class="status-msg" style="margin-top:8px;"></div>
    </div>

    <!-- ===== MC SCREEN ===== -->
    <div class="hidden" id="screen-mc">
      <div class="score-row">
        <span id="mc-count">Question 0</span>
        <div class="hearts-display" id="mc-hearts"></div>
        <span id="mc-score">Score: 0</span>
      </div>
      <div class="card">
        <div class="word-display" id="mc-word"></div>
        <div class="word-caption" id="mc-category"></div>
      </div>
      <div id="mc-options"></div>
      <div id="mc-reveal-container"></div>
      <button class="quit-btn" id="mc-quit-btn">✕ Quit</button>
    </div>

    <!-- ===== MATCH SCREEN ===== -->
    <div class="hidden" id="screen-match">
      <div class="score-row">
        <span id="match-count">Conjugate: </span>
        <span id="match-score">Correct: 0/6</span>
        <div class="hearts-display" id="match-hearts"></div>
      </div>
      <div class="match-grid">
        <div class="match-col" id="match-left"></div>
        <div class="match-col" id="match-right"></div>
      </div>
      <div id="match-status" class="status-msg" style="margin-top:10px;"></div>
      <button class="quit-btn" id="match-quit-btn">✕ Quit</button>
    </div>

    <!-- ===== END SCREEN ===== -->
    <div class="hidden card" id="screen-end">
      <div class="tag" style="text-align:center;">session complete</div>
      <div class="end-score" id="end-score">0%</div>
      <div class="end-caption" id="end-caption"></div>
      <button class="primary-btn" id="replay-btn">Play Again</button>
      <button class="ghost-btn" id="change-settings-btn">Change Settings</button>
    </div>

    <footer>made for two — edit words in editor.html</footer>
  </div>

  <script>
    // ================================================================
    //  VOICE MANAGER - IndexedDB (shared with editor)
    // ================================================================
    const VoiceManager = {
      dbName: 'WordDrillsVoices',
      dbVersion: 1,
      storeName: 'recordings',
      db: null,

      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, this.dbVersion);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(this.storeName)) {
              db.createObjectStore(this.storeName, { keyPath: 'wordKey' });
            }
          };
          request.onsuccess = (event) => { this.db = event.target.result;
            resolve(); };
          request.onerror = (event) => { reject(event.target.error); };
        });
      },

      async getRecording(wordKey) {
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction([this.storeName], 'readonly');
          const store = transaction.objectStore(this.storeName);
          const request = store.get(wordKey);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      },

      playAudio(audioBlob) {
        const url = URL.createObjectURL(audioBlob);
        const audio = new Audio(url);
        audio.onended = () => URL.revokeObjectURL(url);
        audio.play();
        return audio;
      }
    };

    // ================================================================
    //  CONFIGURATION
    // ================================================================
    const CONFIG = {
      K: 0.25,
      FLOOR: 0.05,
      COOLDOWN_FRACTION: 0.5,
      MAX_HEARTS: 5,
      BETA: 0.05,
      ROUND_SIZE: 6,
      PRONOUNS: ["ja", "ty", "my", "wy", "on/ona/ono", "oni"],
      FIREBASE: {
        apiKey: "AIzaSyD5kV-BApIMmiJItiBsgDMrsyxKpFh1OI4",
        authDomain: "placcounts.firebaseapp.com",
        projectId: "placcounts",
        storageBucket: "placcounts.firebasestorage.app",
        messagingSenderId: "738608257101",
        appId: "1:738608257101:web:50c11dd49b86ba08b2a404"
      }
    };

    // ================================================================
    //  STATE
    // ================================================================
    const State = {
      allWords: [],
      settings: { categories: [], mode: 'mc', mcType: 'normal' },
      currentUser: null,
      wordStats: {},
      categoryRounds: {},
      statsLoaded: false,
      saveTimer: null,

      mc: {
        queue: [],
        index: 0,
        score: 0,
        totalAttempts: 0,
        hearts: CONFIG.MAX_HEARTS,
        currentItem: null,
        currentOptions: [],
        correctAnswer: null,
        answered: false,
        wrongAttemptRecorded: false,
        pool: [],
        activeCats: []
      },

      verbs: {
        queue: [],
        currentVerb: null,
        score: 0,
        totalAttempts: 0,
        hearts: CONFIG.MAX_HEARTS,
        mcCorrect: 0,
        matchCorrect: 0,
        phase: 'mc',
        _mcAnswered: false
      },

      matching: {
        pairs: [],
        onComplete: null,
        onHeartLost: null,
        selectedLeft: null,
        selectedRight: null,
        matchedCount: 0,
        correctCount: 0,
        isLocked: false
      }
    };

    // ================================================================
    //  DOM HELPERS
    // ================================================================
    const $ = id => document.getElementById(id);
    const $$ = sel => document.querySelectorAll(sel);

    // ================================================================
    //  UTILITY
    // ================================================================
    const Utils = {
      capitalize: s => s.charAt(0).toUpperCase() + s.slice(1),
      shuffle: arr => [...arr].sort(() => Math.random() - 0.5),
      clamp: (val, min, max) => Math.min(Math.max(val, min), max),
      wordKey: item => item.word + '|' + item.translation,
      getWordFromKey: (key, words) => {
        const [word, translation] = key.split('|');
        return words.find(w => w.word === word && w.translation === translation);
      }
    };

    // ================================================================
    //  FIREBASE
    // ================================================================
    const Firebase = {
      init() {
        firebase.initializeApp(CONFIG.FIREBASE);
        this.db = firebase.firestore();
        this.auth = firebase.auth();

        this.auth.signInAnonymously()
          .then(() => {
            console.log('Signed in anonymously');
            $('login-status').textContent = 'Connected to Firestore';
            $('login-status').className = 'status-msg success';
          })
          .catch(err => {
            console.error('Auth error:', err);
            $('login-status').textContent = '⚠️ Firestore auth failed – data may not save.';
            $('login-status').className = 'status-msg error';
          });

        this.db.enablePersistence({ synchronizeTabs: true })
          .catch(err => console.warn('Persistence:', err));
      },

      wordStatsRef(user) {
        return this.db.collection('wordStats').doc(user);
      },

      userSessionsRef(user) {
        return this.db.collection('users').doc(user).collection('sessions');
      },

      async loadWordStats(user) {
        try {
          const snap = await this.wordStatsRef(user).get();
          const data = snap.exists ? snap.data() : {};
          return { words: data.words || {}, categoryRounds: data.categoryRounds || {} };
        } catch (e) {
          console.error('Failed to load word stats:', e);
          return { words: {}, categoryRounds: {} };
        }
      },

      async saveWordStats(user, words, categoryRounds) {
        try {
          await this.wordStatsRef(user).set({ words, categoryRounds });
          return true;
        } catch (e) {
          console.error('Failed to save word stats:', e);
          return false;
        }
      },

      async loadHistory(user) {
        try {
          const snapshot = await this.userSessionsRef(user)
            .orderBy('timestamp', 'desc')
            .limit(50)
            .get();
          const sessions = [];
          snapshot.forEach(doc => sessions.push(doc.data()));
          return sessions;
        } catch (err) {
          console.warn('Error loading history:', err);
          return [];
        }
      },

      async saveSession(user, session) {
        try {
          await this.userSessionsRef(user).add(session);
          return true;
        } catch (err) {
          console.warn('Failed to save session:', err);
          return false;
        }
      }
    };

    // ================================================================
    //  MASTERY ENGINE
    // ================================================================
    const Mastery = {
      getOrCreate(wordKey, stats) {
        if (!stats[wordKey]) {
          stats[wordKey] = {
            pCorrect: 0,
            pIncorrect: 0,
            catCorrect: 0,
            catIncorrect: 0,
            lastCorrectMark: 0,
            lastSeen: 0
          };
        }
        return stats[wordKey];
      },

      practiceMastery(item, stats) {
        const w = stats[Utils.wordKey(item)];
        if (!w) return 0.5;
        const pCorrect = w.pCorrect || 0;
        const pIncorrect = w.pIncorrect || 0;
        return (pCorrect + 1) / (pCorrect + pIncorrect + 2);
      },

      categoryMastery(item, stats) {
        const w = stats[Utils.wordKey(item)];
        if (!w) return 0.5;
        const catCorrect = w.catCorrect || 0;
        const catIncorrect = w.catIncorrect || 0;
        return (catCorrect + 1) / (catCorrect + catIncorrect + 2);
      },

      combinedMastery(item, stats) {
        const pm = this.practiceMastery(item, stats);
        const cm = this.categoryMastery(item, stats);
        return (1 - CONFIG.BETA) * pm + CONFIG.BETA * cm;
      },

      selectionWeight(item, stats, categoryRounds, poolSize) {
        const w = stats[Utils.wordKey(item)];
        const cm = this.combinedMastery(item, stats);
        const cooldown = Math.max(1, poolSize * CONFIG.COOLDOWN_FRACTION);
        const roundsSince = (categoryRounds[item.category] || 0) - (w ? (w.lastCorrectMark || 0) : 0);
        const recencyFactor = Utils.clamp(roundsSince / cooldown, 0, 1);
        return CONFIG.FLOOR + (1 - CONFIG.FLOOR) * (1 - cm) * recencyFactor;
      },

      weightedSample(items, stats, categoryRounds, n) {
        const pool = items.slice();
        const picked = [];
        const count = Math.min(n, pool.length);
        for (let i = 0; i < count; i++) {
          const weights = pool.map(item => this.selectionWeight(item, stats, categoryRounds, pool.length));
          const total = weights.reduce((a, b) => a + b, 0);
          let r = Math.random() * total;
          let idx = pool.length - 1;
          for (let j = 0; j < weights.length; j++) {
            r -= weights[j];
            if (r <= 0) { idx = j; break; }
          }
          picked.push(pool[idx]);
          pool.splice(idx, 1);
        }
        return picked;
      },

      recordAttempt(item, stats, categoryRounds, correct, isCategoryMode) {
        const w = this.getOrCreate(Utils.wordKey(item), stats);
        if (isCategoryMode) {
          if (correct) {
            w.catCorrect = (w.catCorrect || 0) + 1;
            w.lastCorrectMark = categoryRounds[item.category] || 0;
          } else {
            w.catIncorrect = (w.catIncorrect || 0) + 1;
          }
        } else {
          if (correct) {
            w.pCorrect = (w.pCorrect || 0) + 1;
            w.lastCorrectMark = categoryRounds[item.category] || 0;
          } else {
            w.pIncorrect = (w.pIncorrect || 0) + 1;
          }
        }
        w.lastSeen = Date.now();
      },

      incrementRounds(categoryRounds, categories, amount) {
        categories.forEach(c => {
          categoryRounds[c] = (categoryRounds[c] || 0) + amount;
        });
      }
    };

    // ================================================================
    //  UI MANAGER
    // ================================================================
    const UI = {
      screens: ['login', 'setup', 'mc', 'match', 'end'],

      show(screenName, userName) {
        this.screens.forEach(s => $(`screen-${s}`).classList.add('hidden'));
        $(`screen-${screenName}`).classList.remove('hidden');
        $('header-tag').textContent = (screenName === 'login') ? 'login' :
          (screenName === 'setup' ? userName || 'setup' : screenName);
        $('history-card').classList.toggle('hidden', screenName !== 'setup');
      },

      updateHearts(hearts, targetId = 'mc-hearts') {
        const container = $(targetId);
        if (!container) return;
        let html = '';
        for (let i = 0; i < CONFIG.MAX_HEARTS; i++) {
          html += `<span class="${i < hearts ? 'heart-filled' : 'heart-empty'}">♥</span>`;
        }
        container.innerHTML = html;
      },

      showCategory(category) {
        const el = $('mc-category');
        el.textContent = category;
        el.className = 'word-caption revealed';
      },

      hideCategory() {
        const el = $('mc-category');
        el.textContent = '';
        el.className = 'word-caption';
      },

      clearRevealButton() {
        $('mc-reveal-container').innerHTML = '';
      },

      disableAllOptions() {
        $('mc-options').querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      },

      showCorrectAnswer(options) {
        const buttons = $('mc-options').querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
          if (options[idx].isCorrect) {
            btn.classList.add('correct');
          }
          btn.disabled = true;
        });
      }
    };

    // ================================================================
    //  WORDS & CATEGORIES
    // ================================================================
    const WordManager = {
      async load() {
        try {
          // Try loading both files
          const [wordsRes, verbsRes] = await Promise.all([
            fetch('words.json').then(r => r.ok ? r.json() : []),
            fetch('verbs.json').then(r => r.ok ? r.json() : [])
          ]);
          State.allWords = [...wordsRes, ...verbsRes];
          this.populateCategories();
          $('setup-status').textContent = State.allWords.length + ' words loaded';
          return State.allWords;
        } catch (e) {
          $('setup-status').textContent = 'Could not load words.json or verbs.json — check files exist.';
          $('setup-status').className = 'status-msg error';
          return [];
        }
      },

      populateCategories() {
        const cats = [...new Set(State.allWords.map(w => w.category))].sort();
        const panel = $('category-options');
        panel.innerHTML = cats.map(c =>
          `<label class="cat-check"><input type="checkbox" class="cat-checkbox" value="${c}" checked> ${Utils.capitalize(c)}</label>`
        ).join('');
        State.settings.categories = cats.slice();
        this.updateSummary();

        panel.querySelectorAll('.cat-checkbox').forEach(cb => {
          cb.addEventListener('change', () => {
            State.settings.categories = [...panel.querySelectorAll('.cat-checkbox:checked')].map(c => c.value);
            this.updateSummary();
            this.validate();
          });
        });
      },

      updateSummary() {
        const allCats = [...new Set(State.allWords.map(w => w.category))];
        const summary = $('category-summary');
        if (State.settings.categories.length === 0) summary.textContent = 'Select at least one';
        else if (State.settings.categories.length === allCats.length) summary.textContent = 'All categories';
        else summary.textContent = State.settings.categories.map(Utils.capitalize).join(', ');
      },

      validate() {
        const warning = $('category-warning');
        if (State.settings.mcType === 'category' && State.settings.categories.length < 4) {
          warning.textContent = '⚠️ Category mode requires at least 4 categories selected.';
          warning.style.display = 'block';
          return false;
        }
        warning.textContent = '';
        warning.style.display = 'none';
        return true;
      },

      getActivePool() {
        // If Verbs mode, only use verbs category
        if (State.settings.mode === 'verbs') {
          return State.allWords.filter(w => w.category === 'verbs' && w.conjugations && Array.isArray(w.conjugations) && w.conjugations.length === 6);
        }
        return State.allWords.filter(w => State.settings.categories.includes(w.category));
      },

      getCategoryOptions(selectedCategories, correctCategory) {
        const allCats = selectedCategories.slice();
        if (allCats.length === 4) {
          return allCats.sort();
        } else {
          const others = allCats.filter(c => c !== correctCategory);
          const randomOthers = Utils.shuffle(others).slice(0, 3);
          return Utils.shuffle([correctCategory, ...randomOthers]);
        }
      }
    };

    // ================================================================
    //  AUDIO HELPERS
    // ================================================================
    const AudioHelper = {
      async getSpeakerHTML(wordObj, size = '20px') {
        if (!wordObj) return '';
        const key = Utils.wordKey(wordObj);
        const record = await VoiceManager.getRecording(key);
        if (!record) return '';
        return `<span class="speaker-icon" style="font-size:${size};" data-wordkey="${key}" onclick="event.stopPropagation(); AudioHelper.play('${key}')">🔊</span>`;
      },

      async play(wordKey) {
        const record = await VoiceManager.getRecording(wordKey);
        if (record && record.audioBlob) {
          VoiceManager.playAudio(record.audioBlob);
          // Visual feedback
          const icons = document.querySelectorAll(`.speaker-icon[data-wordkey="${wordKey}"]`);
          icons.forEach(icon => {
            icon.classList.add('playing');
            setTimeout(() => icon.classList.remove('playing'), 500);
          });
        }
      }
    };

    // ================================================================
    //  GAME - MULTIPLE CHOICE
    // ================================================================
    const MC = {
      start(pool) {
        const mc = State.mc;
        mc.pool = pool;
        mc.activeCats = State.settings.categories.slice();
        mc.queue = Mastery.weightedSample(
          pool,
          State.wordStats,
          State.categoryRounds,
          1000
        );
        mc.index = 0;
        mc.score = 0;
        mc.totalAttempts = 0;
        mc.hearts = CONFIG.MAX_HEARTS;
        mc.answered = false;
        mc.wrongAttemptRecorded = false;

        UI.show('mc');
        this.render();
        $('mc-quit-btn').classList.remove('hidden');
        $('mc-quit-btn').onclick = () => this.quit();
      },

      async render() {
        const mc = State.mc;
        const isCategoryMode = State.settings.mcType === 'category';
        const isReversed = State.settings.mcType === 'reversed';

        if (mc.index >= mc.queue.length) {
          const more = Mastery.weightedSample(
            mc.pool,
            State.wordStats,
            State.categoryRounds,
            100
          );
          mc.queue = mc.queue.concat(more);
        }

        if (mc.hearts <= 0) {
          this.endGame();
          return;
        }

        Mastery.incrementRounds(State.categoryRounds, mc.activeCats, 1);

        mc.currentItem = mc.queue[mc.index];
        mc.answered = false;
        mc.wrongAttemptRecorded = false;

        // Word display
        let wordText, displayWord;
        if (isCategoryMode) {
          wordText = mc.currentItem.word;
          displayWord = mc.currentItem;
        } else if (isReversed) {
          wordText = mc.currentItem.translation;
          displayWord = mc.currentItem; // Still use Polish word for audio
        } else {
          wordText = mc.currentItem.word;
          displayWord = mc.currentItem;
        }

        // Build word display with speaker (for normal and category mode)
        const wordDisplay = $('mc-word');
        let speakerHTML = '';
        if (!isReversed) {
          // Normal or category: show speaker on word
          speakerHTML = await AudioHelper.getSpeakerHTML(displayWord);
        }
        wordDisplay.innerHTML = wordText + ' ' + speakerHTML;

        UI.hideCategory();
        UI.clearRevealButton();

        $('mc-count').textContent = 'Question ' + (mc.index + 1);
        UI.updateHearts(mc.hearts);
        $('mc-score').textContent = '✅ ' + mc.score;

        let options = [];
        if (isCategoryMode) {
          const correctCat = mc.currentItem.category;
          const categoryOptions = WordManager.getCategoryOptions(
            State.settings.categories,
            correctCat
          );
          options = categoryOptions.map(cat => ({
            text: Utils.capitalize(cat),
            value: cat,
            isCorrect: cat === correctCat,
            wordObj: null // No audio for categories
          }));
        } else {
          const correctTranslation = isReversed ? mc.currentItem.word : mc.currentItem.translation;
          const distractors = Utils.shuffle(mc.pool.filter(w => {
            const trans = isReversed ? w.word : w.translation;
            return trans !== correctTranslation;
          })).slice(0, 3);

          const optionItems = Utils.shuffle([mc.currentItem, ...distractors]);
          options = await Promise.all(optionItems.map(async item => {
            const isCorrect = (isReversed ? item.word : item.translation) === correctTranslation;
            return {
              text: isReversed ? item.word : item.translation,
              value: item,
              isCorrect: isCorrect,
              wordObj: item // For audio (always Polish word)
            };
          }));
        }

        mc.currentOptions = options;
        mc.correctAnswer = options.find(o => o.isCorrect);

        const container = $('mc-options');
        container.innerHTML = '';
        for (let idx = 0; idx < options.length; idx++) {
          const opt = options[idx];
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          
          // Add speaker icon for reversed mode (options are Polish)
          let speakerHTML = '';
          if (isReversed && opt.wordObj) {
            speakerHTML = await AudioHelper.getSpeakerHTML(opt.wordObj, '18px');
          }
          
          btn.innerHTML = speakerHTML + `<span class="option-text">${opt.text}</span>`;
          btn.dataset.index = idx;
          btn.addEventListener('click', () => this.handleAnswer(idx));
          container.appendChild(btn);
        }
      },

      handleAnswer(index) {
        const mc = State.mc;
        if (mc.answered) return;

        const option = mc.currentOptions[index];
        const isCorrect = option.isCorrect;
        const isCategoryMode = State.settings.mcType === 'category';

        if (!isCorrect && !mc.wrongAttemptRecorded) {
          mc.wrongAttemptRecorded = true;
          mc.hearts--;
          UI.updateHearts(mc.hearts);
          mc.totalAttempts++;

          Mastery.recordAttempt(
            mc.currentItem,
            State.wordStats,
            State.categoryRounds,
            false,
            isCategoryMode
          );

          const btn = $('mc-options').querySelector(`.option-btn[data-index="${index}"]`);
          btn.classList.add('wrong');
          btn.classList.add('used');
          btn.disabled = true;

          if (mc.hearts <= 0) {
            setTimeout(() => {
              UI.showCorrectAnswer(mc.currentOptions);
              UI.disableAllOptions();
              setTimeout(() => this.endGame(), 800);
            }, 400);
            return;
          }
          return;
        }

        if (isCorrect) {
          mc.answered = true;
          mc.totalAttempts++;
          mc.score++;

          if (!mc.wrongAttemptRecorded) {
            Mastery.recordAttempt(
              mc.currentItem,
              State.wordStats,
              State.categoryRounds,
              true,
              isCategoryMode
            );
          }

          const btn = $('mc-options').querySelector(`.option-btn[data-index="${index}"]`);
          btn.classList.add('correct');
          UI.disableAllOptions();

          setTimeout(() => {
            mc.index++;
            this.render();
          }, 600);
        } else {
          const btn = $('mc-options').querySelector(`.option-btn[data-index="${index}"]`);
          btn.classList.add('wrong');
          btn.classList.add('used');
          btn.disabled = true;
        }
      },

      endGame() {
        const mc = State.mc;
        Game.end(mc.score, mc.totalAttempts);
      },

      quit() {
        const mc = State.mc;
        // Save progress before ending
        Game.end(mc.score, mc.totalAttempts);
      }
    };

    // ================================================================
    //  MATCHING ENGINE
    // ================================================================
    const MatchingEngine = {
      start(pairs, onComplete, onHeartLost) {
        const m = State.matching;
        m.pairs = pairs.map(p => ({ ...p, status: 'unmatched' }));
        m.onComplete = onComplete;
        m.onHeartLost = onHeartLost;
        m.selectedLeft = null;
        m.selectedRight = null;
        m.matchedCount = 0;
        m.correctCount = 0;
        m.isLocked = false;

        UI.show('match');
        $('match-count').textContent = 'Conjugate: ';
        $('match-score').textContent = 'Correct: 0/' + pairs.length;
        $('match-status').textContent = 'Select any item.';
        this.render();
      },

      async render() {
        const m = State.matching;
        const leftCol = $('match-left');
        const rightCol = $('match-right');
        leftCol.innerHTML = '';
        rightCol.innerHTML = '';

        // Left column: fixed order
        const sortedPairs = [...m.pairs].sort((a, b) => a.id - b.id);
        for (const p of sortedPairs) {
          const div = document.createElement('div');
          let cls = 'match-item';
          if (p.status === 'correct') cls += ' matched-correct';
          else if (p.status === 'failed') cls += ' matched-failed';
          div.className = cls;
          // No speaker for pronouns
          div.textContent = p.left;
          div.dataset.id = p.id;
          div.dataset.side = 'left';
          if (p.status === 'unmatched') {
            div.addEventListener('click', () => this.select('left', p.id, div));
          } else {
            div.style.cursor = 'default';
          }
          leftCol.appendChild(div);
        }

        // Right column: shuffled, show all
        const rightPairs = Utils.shuffle(m.pairs);
        for (const p of rightPairs) {
          const div = document.createElement('div');
          let cls = 'match-item';
          if (p.status === 'correct') cls += ' matched-correct';
          else if (p.status === 'failed') cls += ' matched-failed';
          div.className = cls;
          // No speaker for conjugations
          div.textContent = p.right;
          div.dataset.id = p.id;
          div.dataset.side = 'right';
          if (p.status === 'unmatched') {
            div.addEventListener('click', () => this.select('right', p.id, div));
          } else {
            div.style.cursor = 'default';
          }
          rightCol.appendChild(div);
        }

        const total = m.pairs.length;
        const done = m.pairs.filter(p => p.status !== 'unmatched').length;
        $('match-score').textContent = 'Correct: ' + m.correctCount + '/' + total;

        if (done === total) {
          $('match-status').textContent = '✅ All matched!';
          setTimeout(() => {
            if (m.onComplete) {
              m.onComplete({ correct: m.correctCount, total: total });
            }
          }, 500);
        }
      },

      select(side, id, node) {
        const m = State.matching;
        if (m.isLocked) return;
        const pair = m.pairs.find(p => p.id === id);
        if (pair.status !== 'unmatched') return;

        if (side === 'left') {
          if (m.selectedLeft && m.selectedLeft.id === id) {
            m.selectedLeft.node.classList.remove('selected');
            m.selectedLeft = null;
            $('match-status').textContent = 'Select any item.';
            return;
          }
          if (m.selectedLeft) {
            m.selectedLeft.node.classList.remove('selected');
          }
          m.selectedLeft = { id, node };
          node.classList.add('selected');
          $('match-status').textContent = 'Now select the matching conjugation.';
        } else {
          if (m.selectedRight && m.selectedRight.id === id) {
            m.selectedRight.node.classList.remove('selected');
            m.selectedRight = null;
            $('match-status').textContent = 'Select any item.';
            return;
          }
          if (m.selectedRight) {
            m.selectedRight.node.classList.remove('selected');
          }
          m.selectedRight = { id, node };
          node.classList.add('selected');
          $('match-status').textContent = 'Now select the matching pronoun.';
        }

        if (m.selectedLeft && m.selectedRight) {
          this.attemptMatch();
        }
      },

      attemptMatch() {
        const m = State.matching;
        if (!m.selectedLeft || !m.selectedRight) return;
        m.isLocked = true;

        const leftId = m.selectedLeft.id;
        const rightId = m.selectedRight.id;
        const leftPair = m.pairs.find(p => p.id === leftId);
        const rightPair = m.pairs.find(p => p.id === rightId);

        if (leftPair.status !== 'unmatched' || rightPair.status !== 'unmatched') {
          m.selectedLeft.node.classList.remove('selected');
          m.selectedRight.node.classList.remove('selected');
          m.selectedLeft = null;
          m.selectedRight = null;
          m.isLocked = false;
          return;
        }

        const isMatch = (leftId === rightId);

        if (isMatch) {
          leftPair.status = 'correct';
          rightPair.status = 'correct';
          m.correctCount++;
          m.matchedCount++;
          $('match-status').textContent = '✅ Correct!';
          $('match-status').className = 'status-msg success';
          m.selectedLeft.node.classList.remove('selected');
          m.selectedRight.node.classList.remove('selected');
          m.selectedLeft = null;
          m.selectedRight = null;
          m.isLocked = false;
          this.render();
        } else {
          leftPair.status = 'failed';
          rightPair.status = 'failed';
          m.matchedCount++;
          if (m.onHeartLost) {
            const shouldContinue = m.onHeartLost();
            if (shouldContinue === false) {
              m.isLocked = false;
              return;
            }
          }
          $('match-status').textContent = '❌ Wrong match!';
          $('match-status').className = 'status-msg error';
          m.selectedLeft.node.classList.add('wrong-flash');
          m.selectedRight.node.classList.add('wrong-flash');
          setTimeout(() => {
            m.selectedLeft.node.classList.remove('selected', 'wrong-flash');
            m.selectedRight.node.classList.remove('selected', 'wrong-flash');
            m.selectedLeft = null;
            m.selectedRight = null;
            m.isLocked = false;
            $('match-status').className = 'status-msg';
            this.render();
          }, 500);
        }
      }
    };

    // ================================================================
    //  GAME - VERBS MODE
    // ================================================================
    const VerbsMode = {
      start(pool) {
        const verbPool = pool.filter(w => w.conjugations && Array.isArray(w.conjugations) && w.conjugations.length === 6);
        if (verbPool.length === 0) {
          $('setup-status').textContent = 'No verbs with conjugations found! Add "conjugations" array to verbs in words.json';
          $('setup-status').className = 'status-msg error';
          return;
        }
        const v = State.verbs;
        v.queue = Mastery.weightedSample(verbPool, State.wordStats, State.categoryRounds, 1000);
        v.score = 0;
        v.totalAttempts = 0;
        v.hearts = CONFIG.MAX_HEARTS;
        v.mcCorrect = 0;
        v.matchCorrect = 0;
        v.phase = 'mc';
        v._mcAnswered = false;
        this.nextVerb();
        $('match-quit-btn').classList.remove('hidden');
        $('match-quit-btn').onclick = () => this.quit();
        $('mc-quit-btn').classList.remove('hidden');
        $('mc-quit-btn').onclick = () => this.quit();
      },

      nextVerb() {
        const v = State.verbs;
        if (v.queue.length === 0 || v.hearts <= 0) {
          this.endGame();
          return;
        }
        v.currentVerb = v.queue.shift();
        v.phase = 'mc';
        v._mcAnswered = false;
        this.runMC();
      },

      async runMC() {
        const v = State.verbs;
        const verb = v.currentVerb;
        const isReversed = State.settings.mcType === 'reversed';
        const isCategory = false;

        UI.show('mc');
        UI.clearRevealButton();
        UI.hideCategory();
        UI.updateHearts(v.hearts);
        $('mc-score').textContent = '✅ ' + v.score;
        $('mc-count').textContent = 'Verb MC';

        let wordText, displayWord;
        if (isReversed) {
          wordText = verb.translation;
          displayWord = verb;
        } else {
          wordText = verb.word;
          displayWord = verb;
        }

        // Speaker only on the verb display (always)
        const wordDisplay = $('mc-word');
        const speakerHTML = await AudioHelper.getSpeakerHTML(displayWord);
        wordDisplay.innerHTML = wordText + ' ' + speakerHTML;

        const pool = WordManager.getActivePool();
        let options = [];
        const distractors = Utils.shuffle(pool.filter(w => {
          const compare = isReversed ? w.word : w.translation;
          return compare !== (isReversed ? verb.word : verb.translation);
        })).slice(0, 3);
        const optionItems = Utils.shuffle([verb, ...distractors]);
        options = await Promise.all(optionItems.map(async item => {
          const isCorrect = (isReversed ? item.word : item.translation) === (isReversed ? verb.word : verb.translation);
          return {
            text: isReversed ? item.word : item.translation,
            value: item,
            isCorrect: isCorrect,
            wordObj: item // For audio (always Polish)
          };
        }));

        const container = $('mc-options');
        container.innerHTML = '';
        for (let idx = 0; idx < options.length; idx++) {
          const opt = options[idx];
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          // No speaker on conjugations
          btn.innerHTML = `<span class="option-text">${opt.text}</span>`;
          btn.dataset.index = idx;
          btn.addEventListener('click', () => this.handleMCAnswer(idx, options));
          container.appendChild(btn);
        }
      },

      handleMCAnswer(index, options) {
        const v = State.verbs;
        if (v._mcAnswered) return;
        v._mcAnswered = true;

        const verb = v.currentVerb;
        const option = options[index];
        const isCorrect = option.isCorrect;
        const isCategory = false;

        Mastery.recordAttempt(verb, State.wordStats, State.categoryRounds, isCorrect, isCategory);
        v.totalAttempts++;
        if (isCorrect) {
          v.mcCorrect++;
          v.score++;
        } else {
          v.hearts--;
          UI.updateHearts(v.hearts);
          if (v.hearts <= 0) {
            const btns = $('mc-options').querySelectorAll('.option-btn');
            btns.forEach((b, i) => {
              b.disabled = true;
              if (options[i].isCorrect) b.classList.add('correct');
            });
            setTimeout(() => this.endGame(), 1000);
            return;
          }
        }

        const btns = $('mc-options').querySelectorAll('.option-btn');
        btns.forEach((b, i) => {
          b.disabled = true;
          if (options[i].isCorrect) b.classList.add('correct');
          if (i === index && !isCorrect) b.classList.add('wrong');
        });

        setTimeout(() => {
          v._mcAnswered = false;
          v.phase = 'matching';
          this.runMatching();
        }, 800);
      },

      runMatching() {
        const v = State.verbs;
        const verb = v.currentVerb;
        const conj = verb.conjugations;
        const pronouns = CONFIG.PRONOUNS;
        const pairs = pronouns.map((p, i) => ({
          id: i,
          left: p,
          right: conj[i] || '?'
        }));

        $('match-count').textContent = 'Conjugate: ' + verb.word;
        $('match-score').textContent = 'Correct: 0/' + pairs.length;
        $('match-status').textContent = 'Select any item.';
        UI.updateHearts(v.hearts, 'match-hearts');

        MatchingEngine.start(pairs, (result) => {
          v.matchCorrect += result.correct;
          v.totalAttempts += result.total;
          v.score += result.correct;
          const allCorrect = result.correct === pairs.length;
          Mastery.recordAttempt(verb, State.wordStats, State.categoryRounds, allCorrect, false);
          setTimeout(() => {
            v.phase = 'mc';
            this.nextVerb();
          }, 600);
        }, () => {
          v.hearts--;
          UI.updateHearts(v.hearts, 'match-hearts');
          if (v.hearts <= 0) {
            this.endGame();
            return false;
          }
          return true;
        });
      },

      endGame() {
        const v = State.verbs;
        Game.end(v.score, v.totalAttempts);
      },

      quit() {
        const v = State.verbs;
        // Save progress before ending
        Game.end(v.score, v.totalAttempts);
      }
    };

    // ================================================================
    //  GAME - END
    // ================================================================
    const Game = {
      end(score, total) {
        UI.show('end');
        const pct = total > 0 ? Math.round((score / total) * 100) : 0;
        $('end-score').textContent = pct + '%';
        $('end-caption').textContent = '✅ ' + score + ' correct answers';

        const modeType = State.settings.mode === 'mc' ? State.settings.mcType : null;
        const session = {
          mode: State.settings.mode,
          categories: State.settings.categories.slice(),
          correct: score,
          total: total,
          mcType: modeType,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        Firebase.saveSession(State.currentUser, session);
        this.saveStats();
      },

      saveStats() {
        Firebase.saveWordStats(
          State.currentUser,
          State.wordStats,
          State.categoryRounds
        ).then(success => {
          if (success) {
            $('save-status').textContent = '✓ Progress saved';
            $('save-status').className = 'status-msg success';
            setTimeout(() => { $('save-status').textContent = ''; }, 2000);
          }
        });
      }
    };

    // ================================================================
    //  HISTORY
    // ================================================================
    const History = {
      async load(user) {
        const sessions = await Firebase.loadHistory(user);
        this.render(sessions);
      },

      render(history) {
        const agg = { mc: { correct: 0, total: 0 }, verbs: { correct: 0, total: 0 } };
        history.forEach(h => {
          const key = h.mode === 'verbs' ? 'verbs' : 'mc';
          if (agg[key]) {
            agg[key].correct += h.correct || 0;
            agg[key].total += h.total || 0;
          }
        });

        $('stat-mc-num').textContent = agg.mc.correct + '/' + agg.mc.total;
        $('stat-mc-acc').textContent = (agg.mc.total ? Math.round(agg.mc.correct / agg.mc.total * 100) : 0) + '%';
        $('stat-verbs-num').textContent = agg.verbs.correct + '/' + agg.verbs.total;
        $('stat-verbs-acc').textContent = (agg.verbs.total ? Math.round(agg.verbs.correct / agg.verbs.total * 100) : 0) + '%';

        const container = $('history-list');
        if (history.length === 0) {
          container.innerHTML = '<div class="history-empty">No sessions yet</div>';
          return;
        }

        const modeLabel = m => m === 'verbs' ? 'Verbs' : 'MC';
        const allCats = [...new Set(State.allWords.map(w => w.category))];
        const catLabel = cats => {
          if (!Array.isArray(cats)) return cats === 'all' ? 'All' : Utils.capitalize(cats);
          if (cats.length === allCats.length) return 'All';
          return cats.map(Utils.capitalize).join(', ');
        };

        container.innerHTML = history.map(h =>
          `<div class="history-row">
           <span><span class="history-mode">${modeLabel(h.mode)}${h.mcType ? ' (' + h.mcType + ')' : ''}</span>
            <span class="history-score">✅ ${h.correct}</span></span>
            <span class="history-cat">${catLabel(h.categories !== undefined ? h.categories : h.category)}</span>
          </div>`
        ).join('');
      }
    };

    // ================================================================
    //  LOGIN
    // ================================================================
    const Login = {
      attempt() {
        const name = $('login-input').value.trim();
        if (!name) {
          $('login-status').textContent = 'Please enter your name.';
          $('login-status').className = 'status-msg error';
          return;
        }
        State.currentUser = name;
        $('header-tag').textContent = name;
        $('login-status').textContent = '';
        $('login-status').className = 'status-msg';
        this.afterLogin();
      },

      async afterLogin() {
        $('setup-status').textContent = 'Loading progress...';
        $('setup-status').className = 'status-msg';

        const data = await Firebase.loadWordStats(State.currentUser);
        State.wordStats = data.words;
        State.categoryRounds = data.categoryRounds;
        State.statsLoaded = true;

        $('setup-status').textContent = '';
        UI.show('setup', State.currentUser);
        WordManager.validate();
        await History.load(State.currentUser);
      },

      logout() {
        State.currentUser = null;
        $('login-input').value = '';
        UI.show('login');
        $('header-tag').textContent = 'login';
        $('stat-mc-num').textContent = '0/0';
        $('stat-mc-acc').textContent = '0%';
        $('stat-verbs-num').textContent = '0/0';
        $('stat-verbs-acc').textContent = '0%';
        $('history-list').innerHTML = '<div class="history-empty">Sign in to see history</div>';
      }
    };

    // ================================================================
    //  SETUP
    // ================================================================
    const Setup = {
      init() {
        // Category toggle
        $('category-toggle').addEventListener('click', () => {
          $('category-options').classList.toggle('hidden');
        });

        // Mode selection
        $$('#mode-row .mode-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            $$('#mode-row .mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            State.settings.mode = btn.dataset.mode;
            
            // Show/hide category section based on mode
            const categorySection = $('category-section');
            if (State.settings.mode === 'verbs') {
              categorySection.style.display = 'none';
              // Force categories to ['verbs'] for verbs mode
              State.settings.categories = ['verbs'];
              $('category-summary').textContent = 'Verbs only';
              // Hide category warning
              $('category-warning').textContent = '';
              $('category-warning').style.display = 'none';
            } else {
              categorySection.style.display = 'block';
              // Restore categories from checkboxes
              const checked = [...document.querySelectorAll('.cat-checkbox:checked')].map(c => c.value);
              State.settings.categories = checked.length > 0 ? checked : ['verbs'];
              WordManager.updateSummary();
            }

            // Hide category MC type for verbs
            const catBtn = document.querySelector('.mc-type-btn[data-mctype="category"]');
            if (State.settings.mode === 'verbs') {
              catBtn.style.display = 'none';
              if (State.settings.mcType === 'category') {
                State.settings.mcType = 'normal';
                document.querySelector('.mc-type-btn[data-mctype="normal"]').classList.add('active');
                document.querySelector('.mc-type-btn[data-mctype="category"]').classList.remove('active');
              }
            } else {
              catBtn.style.display = '';
            }
            WordManager.validate();
          });
        });

        $$('.mc-type-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            $$('.mc-type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            State.settings.mcType = btn.dataset.mctype;
            WordManager.validate();
          });
        });

        $('start-btn').addEventListener('click', () => this.startGame());
        $('stats-btn').addEventListener('click', () => {
          window.open('https://hubitml.github.io/Audrey/stats', '_blank');
        });
        $('logout-btn').addEventListener('click', () => Login.logout());
      },

      startGame() {
        if (!State.currentUser) return;
        if (!State.statsLoaded) {
          $('setup-status').textContent = 'Still loading progress, one sec...';
          $('setup-status').className = 'status-msg';
          return;
        }

        if (State.settings.mode === 'mc' && State.settings.categories.length === 0) {
          $('setup-status').textContent = 'Select at least one category.';
          $('setup-status').className = 'status-msg error';
          return;
        }

        if (State.settings.mode === 'verbs') {
          // Force categories to ['verbs'] for verbs mode
          State.settings.categories = ['verbs'];
        }

        if (State.settings.mode === 'verbs' && State.settings.mcType === 'category') {
          $('setup-status').textContent = 'Category mode not available for Verbs.';
          $('setup-status').className = 'status-msg error';
          return;
        }

        if (State.settings.mcType === 'category' && State.settings.categories.length < 4) {
          $('setup-status').textContent = 'Category mode requires at least 4 categories.';
          $('setup-status').className = 'status-msg error';
          return;
        }

        const pool = WordManager.getActivePool();
        if (pool.length < 2) {
          $('setup-status').textContent = 'Need at least 2 words in selected categories.';
          $('setup-status').className = 'status-msg error';
          return;
        }

        if (State.settings.mode === 'mc') {
          MC.start(pool);
        } else {
          VerbsMode.start(pool);
        }
      }
    };

    // ================================================================
    //  EVENT BINDINGS
    // ================================================================
    $('login-btn').addEventListener('click', () => Login.attempt());
    $('login-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') Login.attempt();
    });

    $('replay-btn').addEventListener('click', () => {
      if (!State.currentUser) return;
      const pool = WordManager.getActivePool();
      if (State.settings.mode === 'mc') MC.start(pool);
      else VerbsMode.start(pool);
    });

    $('change-settings-btn').addEventListener('click', () => UI.show('setup', State.currentUser));

    // ================================================================
    //  INITIALIZATION
    // ================================================================
    async function init() {
      Firebase.init();
      Setup.init();
      await VoiceManager.init();
      await WordManager.load();
      if (State.currentUser) {
        await Login.afterLogin();
      }
    }

    init();
  </script>
</body>
</html>
